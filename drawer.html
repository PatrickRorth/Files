<title>Drawer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one floating window on a tinted desk — sidebar | tabs + toolbar + content | inspector */
:root{
  --desk:#E3E7EE; --bg:#FCFDFE; --side:#F3F5F9; --raise:#FFFFFF;
  --fg:#161A22; --fg2:#566070; --fg3:#8A92A3; --line:#E4E8EF; --line2:#D2D8E2;
  --hover:#EEF1F7; --accent:#3552D6; --accent-fg:#FFFFFF; --accent-soft:#E8EDFD; --sel:#DEE6FE; --sel-line:#9EB1F5;
  --danger:#C92A4B; --label-fg:#FFFFFF; --mark:#FFE59A;
  --k-folder:#4C6EF5; --k-image:#0B8A9A; --k-video:#D9720B; --k-audio:#C2255C; --k-pdf:#D63B2F; --k-doc:#2F6FDE;
  --k-sheet:#2B8A3E; --k-slides:#E8590C; --k-code:#7048E8; --k-text:#5C6577; --k-archive:#8C6D46; --k-other:#7A8394;
  --t-red:#E03131; --t-orange:#E8830C; --t-yellow:#D4A20B; --t-green:#2F9E44; --t-blue:#1C7ED6; --t-purple:#9C36B5;
  --shadow:0 1px 2px rgb(20 30 60 / .06), 0 18px 50px -18px rgb(20 30 60 / .25);
  --pop:0 12px 40px -10px rgb(15 20 40 / .30), 0 0 0 1px var(--line2);
  --f-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-display:"Bricolage Grotesque", "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#07090D; --bg:#12151C; --side:#0E1117; --raise:#191D26;
  --fg:#E6E9EF; --fg2:#A3AAB8; --fg3:#6B7385; --line:#222733; --line2:#2F3543;
  --hover:#1B2029; --accent:#8399FF; --accent-fg:#0B1030; --accent-soft:#1C2444; --sel:#212C54; --sel-line:#4D62B4;
  --danger:#FF6B86; --label-fg:#0D1018; --mark:#6B5A12;
  --k-folder:#7B93FF; --k-image:#3BC9DB; --k-video:#FFA94D; --k-audio:#F06595; --k-pdf:#FF7B6B; --k-doc:#6FA2FF;
  --k-sheet:#51CF66; --k-slides:#FF922B; --k-code:#A48BFF; --k-text:#A0A8B8; --k-archive:#C9A87A; --k-other:#9AA2B2;
  --t-red:#FF6B6B; --t-orange:#FFA94D; --t-yellow:#FFD43B; --t-green:#69DB7C; --t-blue:#4DABF7; --t-purple:#DA77F2;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 18px 50px -18px rgb(0 0 0 / .7);
  --pop:0 12px 40px -10px rgb(0 0 0 / .7), 0 0 0 1px var(--line2);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#07090D; --bg:#12151C; --side:#0E1117; --raise:#191D26;
  --fg:#E6E9EF; --fg2:#A3AAB8; --fg3:#6B7385; --line:#222733; --line2:#2F3543;
  --hover:#1B2029; --accent:#8399FF; --accent-fg:#0B1030; --accent-soft:#1C2444; --sel:#212C54; --sel-line:#4D62B4;
  --danger:#FF6B86; --label-fg:#0D1018; --mark:#6B5A12;
  --k-folder:#7B93FF; --k-image:#3BC9DB; --k-video:#FFA94D; --k-audio:#F06595; --k-pdf:#FF7B6B; --k-doc:#6FA2FF;
  --k-sheet:#51CF66; --k-slides:#FF922B; --k-code:#A48BFF; --k-text:#A0A8B8; --k-archive:#C9A87A; --k-other:#9AA2B2;
  --t-red:#FF6B6B; --t-orange:#FFA94D; --t-yellow:#FFD43B; --t-green:#69DB7C; --t-blue:#4DABF7; --t-purple:#DA77F2;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 18px 50px -18px rgb(0 0 0 / .7);
  --pop:0 12px 40px -10px rgb(0 0 0 / .7), 0 0 0 1px var(--line2);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.4;
  padding:0;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:16px;height:16px;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr) 300px;background:var(--bg);overflow:hidden;position:relative;
  padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.titlebar{display:flex;align-items:stretch;background:var(--side);border-bottom:1px solid var(--line);flex:none;min-width:0}
.titlebar .tabs{flex:1;border-bottom:0;min-width:0}
.winctl{display:flex;align-items:center;gap:2px;padding:6px 8px 0 4px;flex:none}
.winctl .iconbtn{width:34px;height:30px}
.app.no-preview{grid-template-columns:232px minmax(0,1fr)}
.app.no-preview .preview{display:none}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
.brand-mark svg{width:16px;height:16px}
.brand b{font-family:var(--f-display);font-weight:650;font-size:17px;letter-spacing:-.01em}
.brand .side-close{margin-left:auto;display:none}
.side-scroll{flex:1;overflow:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:14px}
.slabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600;padding:0 8px 4px}
.sgroup{display:flex;flex-direction:column;gap:1px}
.sitem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:var(--fg2);text-align:left;width:100%;position:relative}
.sitem:hover{background:var(--hover);color:var(--fg)}
.sitem.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.sitem span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .cnt{font-family:var(--f-mono);font-size:11px;color:var(--fg3)}
.tdot{width:9px;height:9px;border-radius:50%;flex:none;margin:0 3.5px}
.storage{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.storage-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--fg2)}
.storage-top b{color:var(--fg);font-weight:600}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);gap:1.5px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--fg3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block}
.side-actions{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--fg3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.side-actions .btn{flex:1;justify-content:center}

/* Center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);background:var(--side);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 11px;border-radius:8px 8px 0 0;color:var(--fg2);max-width:200px;min-width:0;flex:none;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--bg);color:var(--fg);border-color:var(--line)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tab .x{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;opacity:.55}
.tab .x:hover{background:var(--line);opacity:1}
.tab .x .ic{width:12px;height:12px}
.tab-new{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--fg3);margin:0 0 2px 4px;flex:none}
.tab-new:hover{background:var(--hover);color:var(--fg)}

.toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex:none;flex-wrap:wrap}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg2);flex:none}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
.navgrp{display:flex;gap:2px}
#bMenu{display:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--side);padding:0 4px;overflow:hidden;cursor:text}
.crumbs-in{display:flex;align-items:center;min-width:0;overflow:hidden}
.crumb{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:6px;color:var(--fg2);white-space:nowrap;cursor:pointer;min-width:0;flex-shrink:1}
.crumb:last-child{color:var(--fg);font-weight:500;flex-shrink:0}
.crumb:hover{background:var(--hover);color:var(--fg)}
.crumb .ic{width:14px;height:14px}
.csep{color:var(--fg3);flex:none;display:grid}
.csep .ic{width:12px;height:12px}
.crumbs input{flex:1;border:0;background:none;outline:none;font-family:var(--f-mono);font-size:12.5px;padding:0 6px;min-width:0}
.search{position:relative;width:min(280px, 34%);min-width:170px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg3)}
.search input{width:100%;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--side);padding:0 52px 0 32px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--fg3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--raise);line-height:16px;white-space:nowrap}

.lochead{display:flex;align-items:flex-end;gap:12px;padding:6px 18px 12px;flex:none;flex-wrap:wrap}
.loctitle{flex:1;min-width:180px}
.loctitle h1{font-family:var(--f-display);font-weight:650;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.locsum{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--fg2);font-size:12.5px;flex-wrap:wrap}
.locsum .bar{width:120px;height:5px}
.locctl{display:flex;align-items:center;gap:6px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;background:var(--side)}
.seg button{width:28px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--fg2)}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12), 0 0 0 1px var(--line2)}
.filters{display:flex;gap:6px;padding:0 18px 10px;flex-wrap:wrap;align-items:center;flex:none}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line2);color:var(--fg2);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--fg);border-color:var(--fg3)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fsep{width:1px;height:16px;background:var(--line2);margin:0 4px}

.main{flex:1;overflow:auto;position:relative;padding:0 14px 20px;min-height:0;outline:none}
.main.mode-columns{overflow:hidden;padding:0}
.main.drop-hot{background:var(--accent-soft)}
.status{display:flex;align-items:center;gap:14px;padding:0 16px;height:30px;border-top:1px solid var(--line);color:var(--fg3);font-size:12px;flex:none;white-space:nowrap;overflow:hidden}
.status .grow{flex:1}
.status b{color:var(--fg2);font-weight:500}

/* Grid view */
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(118px, 1fr));gap:6px;padding:2px 4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 8px 10px;border-radius:var(--r);border:1px solid transparent;position:relative;cursor:default;user-select:none;min-width:0}
.tile:hover{background:var(--hover)}
.tile .thumb{height:78px;width:100%;display:grid;place-items:center}
.tile .nm{font-weight:500;text-align:center;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;padding:1px 4px;border-radius:4px}
.tile .meta{font-size:11.5px;color:var(--fg3);margin-top:-4px}
.tile .badges{position:absolute;top:8px;right:8px;display:flex;gap:3px;align-items:center}
.badges .tdot{width:8px;height:8px;margin:0;box-shadow:0 0 0 2px var(--bg)}
.star-badge{color:var(--t-yellow)}
.star-badge .ic{width:13px;height:13px;fill:currentColor}
.item.sel{background:var(--sel);border-color:var(--sel-line)}
.item.focus{outline:2px solid var(--accent);outline-offset:-2px}
.item.cut{opacity:.45}
.item.drop-hot, .sitem.drop-hot, .crumb.drop-hot{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.g-folder{width:70px;height:56px}
.g-page{width:48px;height:60px}
.g-img{width:96px;height:72px;border-radius:6px;overflow:hidden;position:relative;
  background:linear-gradient(160deg, hsl(var(--h) 62% 74%), hsl(calc(var(--h) + 48) 44% 36%));box-shadow:0 0 0 1px rgb(0 0 0 / .08), 0 2px 6px -2px rgb(0 0 0 / .25)}
.g-img svg,.g-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g-img.vid{background:linear-gradient(160deg, hsl(var(--h) 35% 30%), hsl(calc(var(--h) + 40) 40% 14%))}
.g-img .play{position:absolute;inset:0;display:grid;place-items:center}
.g-img .play span{width:26px;height:26px;border-radius:50%;background:rgb(255 255 255 / .9);display:grid;place-items:center;color:#111}
.g-img .play svg{position:static;width:12px;height:12px;fill:#111}
.g-img .dur{position:absolute;right:4px;bottom:4px;font-family:var(--f-mono);font-size:9.5px;background:rgb(0 0 0 / .6);color:#fff;padding:1px 4px;border-radius:3px}

/* List view */
.list{display:flex;flex-direction:column;min-width:0}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 160px 130px 84px 64px;align-items:center;gap:12px;padding:0 10px;height:36px;border-radius:7px;border:1px solid transparent;user-select:none;min-width:0}
.list.searching .lrow{grid-template-columns:minmax(0,1fr) minmax(0,190px) 130px 84px 64px}
.lrow:not(.lhead):hover{background:var(--hover)}
.list > .lrow:nth-child(odd):not(.lhead):not(.sel):not(:hover){background:color-mix(in srgb, var(--side) 55%, transparent)}
.lhead{position:sticky;top:0;background:var(--bg);z-index:2;height:32px;color:var(--fg3);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px}
.lhead button{display:flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.lhead button:hover,.lhead button.on{color:var(--fg)}
.lhead .ic{width:12px;height:12px}
.lname{display:flex;align-items:center;gap:10px;min-width:0}
.lname .sg{width:26px;height:24px;display:grid;place-items:center;flex:none}
.lname .sg .g-folder{width:24px;height:20px}
.lname .sg .g-page{width:18px;height:23px}
.lname .sg .g-img{width:26px;height:20px;border-radius:3px}
.lname .sg .g-img .play,.lname .sg .g-img .dur{display:none}
.lname .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.lcell{color:var(--fg2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcell.r{text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.ltags{display:flex;gap:3px;align-items:center;justify-content:flex-end}
.ltags .tdot{margin:0;width:8px;height:8px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* Columns view */
.cols{display:flex;height:100%;overflow-x:auto;overflow-y:hidden}
.col{width:240px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:6px}
.citem{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;border:1px solid transparent;user-select:none;min-width:0}
.citem:hover{background:var(--hover)}
.citem.path{background:var(--line)}
.citem .sg{width:22px;display:grid;place-items:center;flex:none}
.citem .sg .g-folder{width:20px;height:16px}
.citem .sg .g-page{width:15px;height:19px}
.citem .sg .g-img{width:22px;height:16px;border-radius:3px}
.citem .sg .g-img .play,.citem .sg .g-img .dur{display:none}
.citem .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.citem .chev{color:var(--fg3)}
.citem .chev .ic{width:12px;height:12px}
.col-empty{color:var(--fg3);font-size:12px;padding:12px}

.rename{font:inherit;font-weight:500;border:1px solid var(--accent);border-radius:4px;background:var(--bg);outline:none;padding:1px 4px;width:100%;box-shadow:0 0 0 3px var(--accent-soft);text-align:inherit;min-width:0}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:70px 20px;color:var(--fg2)}
.empty .eic{width:56px;height:56px;border-radius:16px;background:var(--side);border:1px dashed var(--line2);display:grid;place-items:center;color:var(--fg3);margin-bottom:6px}
.empty .eic .ic{width:24px;height:24px}
.empty h3{margin:0;font-family:var(--f-display);font-weight:650;font-size:17px;color:var(--fg)}
.empty p{margin:0;max-width:40ch}
.empty .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}

.marquee{position:fixed;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent);border-radius:3px;pointer-events:none;z-index:50}

/* Inspector */
.preview{border-left:1px solid var(--line);background:var(--side);display:flex;flex-direction:column;min-height:0}
.pv-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0 16px;color:var(--fg3);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.pv-body{flex:1;overflow:auto;padding:12px 16px 18px;display:flex;flex-direction:column;gap:16px}
.pv-stage{border-radius:12px;background:var(--bg);border:1px solid var(--line);min-height:170px;display:grid;place-items:center;padding:18px;overflow:hidden;position:relative}
.pv-stage .g-folder{width:110px;height:88px}
.pv-stage .g-page{width:84px;height:105px}
.pv-stage .g-img{width:100%;height:auto;aspect-ratio:4/3;max-width:100%}
.pv-stage img.real, .pv-stage video{max-width:100%;max-height:260px;border-radius:6px;display:block}
.pv-stage audio{width:100%}
.wave{width:100%;height:70px;display:block}
.pv-name{font-family:var(--f-display);font-weight:650;font-size:18px;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere;margin:0}
.pv-kind{color:var(--fg2);font-size:12.5px;margin-top:3px}
.pv-actions{display:flex;gap:6px;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:12.5px;margin:0}
.dl dt{color:var(--fg3)}
.dl dd{margin:0;color:var(--fg);overflow-wrap:anywhere}
.dl dd a{color:var(--accent);cursor:pointer;text-decoration:none}
.dl dd a:hover{text-decoration:underline}
.pv-sec{display:flex;flex-direction:column;gap:8px}
.pv-sec > .slabel{padding:0}
.tagpick{display:flex;flex-wrap:wrap;gap:5px}

function itemAttrs(n, cls){

}
const nameHTML = n => S.renaming === n.id ? `<input class="rename" id="renameIn" value="${esc(n.name)}" spellcheck="false" aria-label="New name">` : hl(n.name, T().q);
const badges = n => (n.starred ? `<span class="star-badge">${ic('star')}</span>` : '') + n.tags.map(tagDot).join('');

function renderColumns(){
  const path = pathOf(T().loc);

    const nextId = path[i + 1] && path[i + 1].id;
    const items = i === path.length - 1 ? ITEMS : sortItems(kids(folder.id));
    const body = items.length ? items.map(n => {
      const isPath = n.id === nextId;
      return `<div ${itemAttrs(n, 'citem' + (isPath ? ' path' : ''))}><span class="sg">${glyph(n)}</span><span class="tx">${nameHTML(n)}</span>${badges(n)}${n.type === 'folder' ? `<span class="chev">${ic('fwd')}</span>` : ''}</div>`;
    }).join('') : `<div class="col-empty">Empty folder</div>`;
    return `<div class="col" data-col="${folder.id}">${body}</div>`;
  });
  main.innerHTML = `<div class="cols">${cols.join('')}</div>`;

}
function renderEmpty(){

function afterMainRender(){

  const pv = $('#preview');

    pv.innerHTML = head + `<div class="pv-body">
      <div class="pv-stage"><div class="stack">${shown.map((n, i) => `<div style="transform:translate(${(i - (shown.length - 1) / 2) * 16}px, ${(i - (shown.length - 1) / 2) * -8}px) rotate(${(i - 1) * 6}deg)">${glyph(n)}</div>`).join('')}</div></div>
      <div><h2 class="pv-name">${plural(ns.length, 'item')}</h2><div class="pv-kind mono">${fmtSize(total)} in total</div></div>
      ${tagPicker(ns)}
      <div class="pv-actions">${T().loc === 'trash' ? `<button class="btn sm" data-act="restore-sel">${ic('restore')}Put back</button>` : `<button class="btn sm" data-act="star-sel">${ic('star')}${ns.every(n => n.starred) ? 'Unstar' : 'Star'} all</button><button class="btn sm" data-act="dup-sel">${ic('copy')}Duplicate</button><button class="btn sm" data-act="trash-sel">${ic('trash')}Move to Trash</button>`}</div>
    </div>`;
    return;
  }
  const n = N[ids[0]];
  if (n.type === 'folder'){ pv.innerHTML = head + `<div class="pv-body">${folderDetails(n, false)}</div>`; return; }
  const k = kindOf(n);
  let stage;
  if (k === 'image') stage = n.url ? `<img class="real" src="${esc(n.url)}" alt="${esc(n.name)}">` : glyph(n);
  else if (k === 'video') stage = n.url ? `<video src="${esc(n.url)}" controls playsinline></video>` : glyph(n);
  else if (k === 'audio') stage = waveform(n) + (n.url ? `<audio src="${esc(n.url)}" controls></audio>` : '');
  else if (k === 'pdf' || k === 'doc' || k === 'slides') stage = `<div class="doc-mock"><i class="h"></i>${Array.from({length:9}, (_, i) => `<i style="width:${60 + (hash(n.name + i) % 40)}%"></i>`).join('')}</div>`;
  else stage = glyph(n);
  const editable = isTextual(n) && n.content != null && !n.trashed;
  const extraRows = [];
  if (k === 'audio' || k === 'video') extraRows.push(['Duration', fmtDur(duration(n))]);
  if (k === 'pdf') extraRows.push(['Pages', Math.max(1, Math.round(n.size / (90 * KB)))]);
  if (k === 'image' && !n.url) extraRows.push(['Dimensions', ['6000 × 4000', '5472 × 3648', '4032 × 3024', '2560 × 1600'][hash(n.name) % 4]]);
  if (editable) extraRows.push(['Lines', n.content.split('\n').length.toLocaleString()]);
  pv.innerHTML = head + `<div class="pv-body">
    ${editable ? '' : `<div class="pv-stage">${stage}</div>`}
    <div><h2 class="pv-name">${esc(n.name)}</h2><div class="pv-kind">${KIND_LABEL[k]} · <span class="mono" id="pvSize">${fmtSize(n.size)}</span></div></div>
    ${editable ? `<div class="pv-sec"><textarea class="editor" id="editor" data-id="${n.id}" spellcheck="false" aria-label="Edit ${esc(n.name)}">${esc(n.content)}</textarea><div class="pv-hint"><span>Edits save as you type</span><span id="pvSaved"></span></div></div>` : ''}
    <div class="pv-actions">${n.trashed ? `<button class="btn sm" data-act="restore-sel">${ic('restore')}Put back</button><button class="btn sm" data-act="delete-sel">${ic('x')}Delete now</button>` :
      `<button class="btn sm" data-act="star" data-arg="${n.id}">${ic('star')}${n.starred ? 'Unstar' : 'Star'}</button><button class="btn sm" data-act="rename" data-arg="${n.id}">${ic('pencil')}Rename</button><button class="btn sm" data-act="trash-sel">${ic('trash')}Trash</button>`}</div>
    ${n.trashed ? '' : tagPicker([n])}
    <div class="pv-sec"><div class="slabel">Details</div><dl class="dl">
      <dt>Kind</dt><dd>${KIND_LABEL[k]}${ext(n.name) ? ` <span class="mono" style="color:var(--fg3)">.${esc(ext(n.name))}</span>` : ''}</dd>
      <dt>Size</dt><dd class="mono">${fmtSize(n.size)} <span style="color:var(--fg3)">(${(n.size || 0).toLocaleString()} bytes)</span></dd>
      ${extraRows.map(([a, b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}
      <dt>Where</dt><dd>${whereLinks(n)}</dd>
      <dt>Modified</dt><dd>${ffmt.format(new Date(n.modified))}</dd>
      <dt>Created</dt><dd>${ffmt.format(new Date(n.created))}</dd>
      ${n.imported ? '<dt>Source</dt><dd>Added from your computer</dd>' : ''}
    </dl></div></div>`;
}
function whereLinks(n){
  if (!N[n.parent]) return '—';
  return pathOf(n.parent).map(p => `<a data-loc="${p.id}">${esc(p.name)}</a>`).join(' / ');
}
function folderDetails(n, isCurrent){
  const all = descendants(n.id); const files = all.filter(c => c.type === 'file'); const total = files.reduce((a, c) => a + c.size, 0);
  const parts = GROUPS.map(g => ({...g, v:files.filter(c => g.kinds.includes(kindOf(c))).reduce((a, c) => a + c.size, 0), c:files.filter(c => g.kinds.includes(kindOf(c))).length})).filter(p => p.c);
  const newest = files.slice().sort((a, b) => b.modified - a.modified)[0];
  return `<div class="pv-stage">${glyph(n)}</div>
    <div><h2 class="pv-name">${esc(n.name)}</h2><div class="pv-kind">${isCurrent ? 'This folder' : 'Folder'} · ${plural(kids(n.id).length, 'item')}</div></div>
    ${isCurrent ? '' : `<div class="pv-actions"><button class="btn sm primary" data-act="open" data-arg="${n.id}">${ic('open')}Open</button><button class="btn sm" data-act="star" data-arg="${n.id}">${ic('star')}${n.starred ? 'Unstar' : 'Star'}</button>${n.trashed ? `<button class="btn sm" data-act="restore-sel">${ic('restore')}Put back</button>` : `<button class="btn sm" data-act="trash-sel">${ic('trash')}Trash</button>`}</div>`}
    ${total ? `<div class="pv-sec"><div class="slabel">What's inside · <span class="mono">${fmtSize(total)}</span></div>
      <div class="bar" style="height:8px">${parts.map(p => `<i style="width:${(p.v / total * 100).toFixed(2)}%;background:var(${p.color})"></i>`).join('')}</div>
      <div class="breakdown">${parts.sort((a, b) => b.v - a.v).map(p => `<div class="row"><i style="background:var(${p.color})"></i><span>${p.label} <span style="color:var(--fg3)">· ${p.c}</span></span><span class="mono">${fmtSize(p.v)}</span></div>`).join('')}</div></div>` : ''}
    ${isCurrent || n.trashed ? '' : tagPicker([n])}
    <div class="pv-sec"><div class="slabel">Details</div><dl class="dl">
      <dt>Contains</dt><dd>${plural(files.length, 'file')}, ${plural(all.length - files.length, 'folder')}</dd>
      ${n.parent ? `<dt>Where</dt><dd>${whereLinks(n)}</dd>` : ''}
      <dt>Modified</dt><dd>${ffmt.format(new Date(n.modified))}</dd>
      ${newest ? `<dt>Latest file</dt><dd>${esc(newest.name)}</dd>` : ''}
    </dl></div>`;
}
function tagPicker(ns){
  return `<div class="pv-sec"><div class="slabel">Tags</div><div class="tagpick">${TAGS.map(t => {
    const on = ns.every(n => n.tags.includes(t.id));
    return `<button class="${on ? 'on' : ''}" data-act="tag" data-arg="${t.id}" aria-pressed="${on}">${tagDot(t.id)}${t.name}</button>`;
  }).join('')}</div></div>`;
}
function waveform(n){
  const h = hash(n.name); let bars = '';
  for (let i = 0; i < 64; i++){
    const v = Math.abs(Math.sin(i * .37 + h % 7) * .6 + Math.sin(i * 1.13 + (h >> 5) % 5) * .35) * .9 + .1;
    const bh = Math.max(3, v * 60);
    bars += `<rect x="${i * 5}" y="${(70 - bh) / 2}" width="3" height="${bh.toFixed(1)}" rx="1.5" fill="var(--k-audio)" opacity="${i < 22 ? 1 : .45}"/>`;
  }
  return `<svg class="wave" viewBox="0 0 320 70" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
}

function renderStatus(){
  const ids = [...S.sel];
  const selSize = ids.reduce((a, id) => a + treeSize(id), 0);
  $('#status').innerHTML = `<span>${plural(ITEMS.length, 'item')}</span>${ids.length ? `<span><b>${ids.length} selected</b> · <span class="mono">${fmtSize(selSize)}</span></span>` : ''}${S.clip ? `<span>${plural(S.clip.ids.length, 'item')} ${S.clip.mode === 'cut' ? 'ready to move' : 'copied'}</span>` : ''}<span class="grow"></span><span class="hint"><kbd>${MOD}K</kbd> Commands</span><span class="hint">Saved in this browser</span>`;
}

/* ---------- Actions ---------- */
function snapshot(){ S.undo.push(JSON.stringify(N)); if (S.undo.length > 40) S.undo.shift(); }
function undo(){
  if (!S.undo.length) return toast('Nothing to undo');
  const urls = {}; for (const id in N) if (N[id].url) urls[id] = N[id].url;
  N = JSON.parse(S.undo.pop());
  for (const id in urls) if (N[id]) N[id].url = urls[id];
  S.renaming = null; render(); save(); toast('Undone');
}
function go(loc){
  const t = T();
  if (t.loc === loc && !t.q) return;
  t.hist = t.hist.slice(0, t.i + 1); t.hist.push(loc); t.i++;
  t.loc = loc; t.q = ''; t.kf = 'all'; t.df = 'any'; t.scope = 'all';
  S.sel.clear(); S.focus = null; S.anchor = null; S.renaming = null; editingPath = false;
  main.scrollTop = 0; app.classList.remove('side-open');
  render(); save();
}
function histStep(d){
  const t = T(); const j = t.i + d;
  if (j < 0 || j >= t.hist.length) return;
  const from = t.loc;
  t.i = j; t.loc = t.hist[j]; t.q = '';
  if (!validLoc(t.loc)){ t.loc = ROOT; }
  S.sel.clear(); S.focus = null; S.renaming = null;
  if (d < 0 && N[from] && N[from].parent === t.loc){ S.sel.add(from); S.focus = from; }
  main.scrollTop = 0; render(); save();
}
function goUp(){
  const t = T(); if (!isFolderId(t.loc) || t.loc === ROOT) return;
  const from = t.loc; go(N[from].parent); S.sel.add(from); S.focus = from; S.anchor = from; render();
}
function open(id){
  const n = N[id]; if (!n) return;
  if (n.type === 'folder'){ if (n.trashed) return toast('Put this folder back from the Trash to open it.'); go(id); return; }
  S.sel.clear(); S.sel.add(id); S.focus = id;
  if (!S.preview) S.preview = true;
  render();
  const ed = $('#editor'); if (ed) ed.focus();
}
function selected(){ return [...S.sel].map(id => N[id]).filter(Boolean); }
function currentFolder(){ const t = T(); return isFolderId(t.loc) && !t.q ? t.loc : ROOT; }

function newFolder(){
  snapshot();
  const p = currentFolder();
  if (p !== T().loc || T().q) go(p);
  const id = createNode(p, uniqueName(p, 'New folder'), 'folder');
  touch(p);
  S.sel.clear(); S.sel.add(id); S.focus = id; S.renaming = id; render(); save();
}
function newFile(kind){
  snapshot();
  const p = currentFolder();
  if (p !== T().loc || T().q) go(p);
  const name = kind === 'md' ? 'Untitled note.md' : 'Untitled.txt';
  const content = kind === 'md' ? '# Untitled note\n\n' : '';
  const id = createNode(p, uniqueName(p, name), 'file', {content, size:content.length});
  touch(p);
  S.sel.clear(); S.sel.add(id); S.focus = id; S.renaming = id; S.preview = true; render(); save();
}
function touch(id){ if (N[id]) N[id].modified = Date.now(); }
function startRename(id){ const n = N[id] || selected()[0]; if (!n || n.trashed) return; S.sel.clear(); S.sel.add(n.id); S.focus = n.id; S.renaming = n.id; render(); }
let committing = false;
function commitRename(){
  if (committing || !S.renaming) return;
  committing = true;
  const id = S.renaming, inp = $('#renameIn'), n = N[id];
  const v = inp ? inp.value.trim() : '';
  S.renaming = null;
  if (n && v && v !== n.name){
    if (/[\/\\]/.test(v)) toast('Names can’t contain / or \\. The name was not changed.');
    else {
      const clash = kids(n.parent).some(c => c.id !== id && c.name.toLowerCase() === v.toLowerCase());
      if (clash) toast(`“${v}” is already used in this folder. Choose a different name.`);
      else { snapshot(); n.name = v; n.modified = Date.now(); save(); }
    }
  }
  committing = false;
  render(); main.focus({preventScroll:true});
}
function trash(ids){
  ids = ids.filter(id => N[id] && id !== ROOT && !N[id].trashed);
  if (!ids.length) return;
  snapshot();
  ids.forEach(id => { N[id].trashed = true; N[id].trashedAt = Date.now(); });
  S.sel.clear(); S.focus = null; render(); save();
  toast(ids.length === 1 ? `Moved “${N[ids[0]].name}” to Trash` : `Moved ${ids.length} items to Trash`, true);
}
function restore(ids){
  ids = ids.filter(id => N[id] && N[id].trashed);
  if (!ids.length) return;
  snapshot();
  ids.forEach(id => { const n = N[id]; n.trashed = false; delete n.trashedAt; if (!N[n.parent] || !alive(N[n.parent])) n.parent = ROOT; n.name = uniqueName(n.parent, n.name, id); });
  S.sel.clear(); render(); save();

}
function destroy(ids){
  const kill = id => { kids(id).forEach(c => kill(c.id)); for (const k in N) if (N[k].parent === id) kill(k); if (N[id] && N[id].url) URL.revokeObjectURL(N[id].url); delete N[id]; };

function confirmDelete(ids, all){

    body: `${all ? `${plural(count, 'item')} will be removed` : 'This is removed'} for good. You can’t put ${count === 1 && !all ? 'it' : 'them'} back afterwards.`,
    confirm: all ? 'Empty Trash' : 'Delete', danger:true,
    run: () => { snapshot(); destroy(ids); S.sel.clear(); render(); save(); toast(all ? 'Trash emptied' : 'Deleted', true); }});
}
function moveItems(ids, target, copy){
  ids = ids.filter(id => N[id] && id !== target && !isAncestor(id, target));
  if (!copy) ids = ids.filter(id => N[id].parent !== target || N[id].trashed);
  if (!ids.length || !isFolderId(target)) return false;
  snapshot();
  const out = [];
  ids.forEach(id => {
    if (copy) out.push(cloneTree(id, target));
    else { const n = N[id]; n.trashed = false; n.parent = target; n.name = uniqueName(target, n.name, id); out.push(id); }
  });
  touch(target);
  render(); save();
  toast(`${copy ? 'Copied' : 'Moved'} ${ids.length === 1 ? '“' + N[out[0]].name + '”' : ids.length + ' items'} to ${N[target].name}`, true);

}

/* ---------- Import ---------- */
async function importFiles(files, parent, viaDir){
  files = [...files];
  if (!files.length) return;
  if (files.length > 3000){ toast(`That’s ${files.length.toLocaleString()} files. Drawer adds the first 3,000.`); files = files.slice(0, 3000); }
  snapshot();
  const dirs = {}; let top = null;
  for (const file of files){
    let p = parent;
    const segs = viaDir && file.webkitRelativePath ? file.webkitRelativePath.split('/').slice(0, -1) : [];
    let acc = '';
    for (const seg of segs){
      acc += '/' + seg;
      if (!dirs[acc]){ dirs[acc] = createNode(p, uniqueName(p, seg), 'folder', {imported:true}); if (!top) top = dirs[acc]; }
      p = dirs[acc];
    }
    const id = createNode(p, uniqueName(p, file.name), 'file', {size:file.size, modified:file.lastModified || Date.now(), imported:true});
    const k = kindOf(N[id]);
    try {
      if (['image','video','audio'].includes(k)) N[id].url = URL.createObjectURL(file);
      else if (isTextual(N[id]) && file.size < 256 * KB) N[id].content = await file.text();
    } catch {}
  }
  touch(parent);
  render(); save();
  toast(top ? `Added “${N[top].name}” with ${plural(files.length, 'file')}` : `Added ${plural(files.length, 'file')} to ${N[parent].name}`, true);
}

function fuzzy(str, q){

/* ---------- Dispatcher ---------- */
function act(name, arg, el){
  const sel = [...S.sel];
  switch (name){
    case 'view': S.view = arg; render(); save(); break;
    case 'preview': S.preview = !S.preview; render(); break;
    case 'sort': if (S.sort.k === arg) S.sort.d *= -1; else S.sort = {k:arg, d:arg === 'name' || arg === 'kind' ? 1 : -1}; render(); save(); break;
    case 'sort-menu': sortMenu(el); break;
    case 'new-menu': { const r = el.getBoundingClientRect(); showMenu(r.right - 220, r.bottom + 4, [{label:'New folder', icon:'folderplus', kbd:MOD + '⇧N', run:newFolder}, {label:'New text file', icon:'fileplus', run:() => newFile('txt')}, {label:'New note (Markdown)', icon:'fileplus', run:() => newFile('md')}, '-', {label:'Add files from your computer…', icon:'upload', run:() => act('import-files')}, {label:'Open a folder from your computer…', icon:'folder', run:() => act('import-dir')}]); break; }
    case 'new-folder': newFolder(); break;
    case 'new-file': newFile(arg); break;
    case 'tab': if (S.tab !== +arg){ S.tab = +arg; S.sel.clear(); S.focus = null; S.renaming = null; render(); save(); } break;
    case 'closetab': { const i = +arg; if (S.tabs.length < 2) break; S.tabs.splice(i, 1); if (S.tab > i || S.tab >= S.tabs.length) S.tab--; S.tab = Math.max(0, S.tab); S.sel.clear(); render(); save(); break; }
    case 'newtab': S.tabs.push(newTab(isFolderId(T().loc) ? T().loc : ROOT)); S.tab = S.tabs.length - 1; S.sel.clear(); render(); save(); break;
    case 'scope': T().scope = arg; render(); break;
    case 'kf': T().kf = arg; render(); break;
    case 'df': T().df = arg; render(); break;
    case 'clear-search': T().q = ''; $('#search').value = ''; render(); break;
    case 'star': toggleStar(arg ? [arg] : sel); break;
    case 'star-sel': toggleStar(sel); break;
    case 'tag': toggleTag(sel.length ? sel : [], arg); break;
    case 'rename': startRename(arg); break;
    case 'open': open(arg); break;
    case 'trash-sel': trash(sel); break;
    case 'dup-sel': duplicate(sel); break;
    case 'restore-sel': restore(sel); break;
    case 'delete-sel': confirmDelete(sel); break;
    case 'empty-trash': { const ids = Object.values(N).filter(n => n.trashed && !trashedAbove(n)).map(n => n.id); if (!ids.length) return toast('Trash is already empty'); confirmDelete(ids, true); break; }
    case 'import-files': $('#fileIn').click(); break;
    case 'import-dir': $('#dirIn').click(); break;
    case 'side-close': app.classList.remove('side-open'); break;
  }
}

// Search
const sIn = $('#search'); let sT = 0;
sIn.addEventListener('input', () => { clearTimeout(sT); sT = setTimeout(() => { const t = T(); t.q = sIn.value; S.sel.clear(); S.focus = null; main.scrollTop = 0; render(); }, 90); });
sIn.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ sIn.value = ''; T().q = ''; render(); main.focus(); }
  if (e.key === 'ArrowDown' || e.key === 'Enter'){ e.preventDefault(); if (ITEMS.length){ S.sel = new Set([ITEMS[0].id]); S.focus = ITEMS[0].id; S.anchor = ITEMS[0].id; render(); main.focus(); } }
});

// Breadcrumb path editing
$('#crumbs').addEventListener('dblclick', e => {
  if (e.target.closest('.crumb')) return;
  editingPath = true;
  const t = T(); const val = isFolderId(t.loc) ? pathOf(t.loc).map(n => n.name).join('/') : 'Home';
  $('#crumbs').innerHTML = `<input id="pathIn" value="${esc(val)}" spellcheck="false" aria-label="Path">`;
  const i = $('#pathIn'); i.focus(); i.select();
  const finish = ok => {
    if (!editingPath) return; editingPath = false;
    if (ok){
      const segs = i.value.split(/[\/\\]/).map(s => s.trim()).filter(Boolean);
      let cur = ROOT; if (segs[0] && segs[0].toLowerCase() === 'home') segs.shift();
      for (const s of segs){ const nx = kids(cur).find(c => c.type === 'folder' && c.name.toLowerCase() === s.toLowerCase()); if (!nx){ toast(`No folder named “${s}” in ${N[cur].name}`); render(); return; } cur = nx.id; }
      go(cur);
    }
    render();
  };
  i.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape') finish(false); });
  i.addEventListener('blur', () => finish(false));
});

// Item interactions
function itemFrom(e){ const el = e.target.closest('.item'); return el && main.contains(el) ? el.dataset.id : null; }
main.addEventListener('click', e => {
  if (e.target.closest('[data-act]')) return;
  if (marqueeMoved){ marqueeMoved = false; return; }
  const id = itemFrom(e);
  if (!id){ if (!e.target.closest('.lhead')){ S.sel.clear(); S.focus = null; render(); } return; }
  if (S.renaming === id) return;
  const add = e.metaKey || e.ctrlKey;
  if (e.shiftKey && S.anchor){
    const a = ITEMS.findIndex(n => n.id === S.anchor), b = ITEMS.findIndex(n => n.id === id);
    if (a >= 0 && b >= 0){ if (!add) S.sel.clear(); for (let i = Math.min(a, b); i <= Math.max(a, b); i++) S.sel.add(ITEMS[i].id); }
  } else if (add){ S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); S.anchor = id; }
  else {
    if (!ITEMS.some(n => n.id === id)){ // a column item outside the current folder
      const n = N[id]; if (n.type === 'folder') return go(id);
      go(n.parent); S.sel.add(id); S.focus = id; S.anchor = id; render(); return;
    }
    if (S.view === 'columns' && N[id].type === 'folder' && !T().q){ return go(id); }
    if (COARSE && N[id].type === 'folder') return open(id);
    S.sel.clear(); S.sel.add(id); S.anchor = id;
  }
  S.focus = id; render();
});
main.addEventListener('dblclick', e => { const id = itemFrom(e); if (id && S.renaming !== id) open(id); });
main.addEventListener('contextmenu', e => {
  e.preventDefault();
  const id = itemFrom(e);
  if (id){ if (!S.sel.has(id)){ S.sel.clear(); S.sel.add(id); S.anchor = id; } S.focus = id; render(); itemMenu(e.clientX, e.clientY); }
  else bgMenu(e.clientX, e.clientY);
});

// Marquee selection
let mq = null, marqueeMoved = false;
main.addEventListener('mousedown', e => {
  if (e.button !== 0 || itemFrom(e) || e.target.closest('.lhead, button, input, textarea, .col-empty')) return;
  if (main.classList.contains('mode-columns')) return;
  const base = (e.metaKey || e.ctrlKey || e.shiftKey) ? new Set(S.sel) : new Set();
  mq = {x:e.clientX, y:e.clientY, base, el:null};
});
document.addEventListener('mousemove', e => {
  if (!mq) return;
  const dx = e.clientX - mq.x, dy = e.clientY - mq.y;
  if (!mq.el){ if (Math.abs(dx) + Math.abs(dy) < 5) return; mq.el = document.createElement('div'); mq.el.className = 'marquee'; document.body.appendChild(mq.el); }
  const mr = main.getBoundingClientRect();
  const x1 = Math.max(mr.left, Math.min(mq.x, e.clientX)), y1 = Math.max(mr.top, Math.min(mq.y, e.clientY));
  const x2 = Math.min(mr.right, Math.max(mq.x, e.clientX)), y2 = Math.min(mr.bottom, Math.max(mq.y, e.clientY));
  Object.assign(mq.el.style, {left:x1 + 'px', top:y1 + 'px', width:(x2 - x1) + 'px', height:(y2 - y1) + 'px'});
  const sel = new Set(mq.base);
  main.querySelectorAll('.item').forEach(el => {
    const r = el.getBoundingClientRect();
    const hit = r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1;
    if (hit) sel.add(el.dataset.id);
    el.classList.toggle('sel', sel.has(el.dataset.id));
  });
  mq.sel = sel;
});
document.addEventListener('mouseup', () => {
  if (!mq) return;
  if (mq.el){ mq.el.remove(); S.sel = mq.sel || new Set(); marqueeMoved = true; S.focus = null; render(); setTimeout(() => marqueeMoved = false, 0); }
  mq = null;
});

// Drag and drop
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('.item'); if (!el) return;
  const id = el.dataset.id;
  if (!S.sel.has(id)){ S.sel.clear(); S.sel.add(id); S.anchor = id; }
  S.drag = [...S.sel];
  e.dataTransfer.effectAllowed = 'copyMove';
  try { e.dataTransfer.setData('text/plain', S.drag.map(i => N[i].name).join('\n')); } catch {}
  document.querySelectorAll('.item.sel').forEach(x => x.classList.add('cut'));
});
document.addEventListener('dragend', () => { S.drag = null; clearDropHot(); render(); });
function clearDropHot(){ document.querySelectorAll('.drop-hot').forEach(x => x.classList.remove('drop-hot')); }
function dropOk(target){
  if (!target) return false;
  if (S.drag){
    if (target === 'trash' || target === 'starred' || target.startsWith('tag:')) return T().loc !== 'trash' || target !== 'trash';
    if (!isFolderId(target)) return false;
    return S.drag.every(id => id !== target && !isAncestor(id, target));
  }
  return isFolderId(target);
}
document.addEventListener('dragover', e => {
  const ext = !S.drag && e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  if (!S.drag && !ext) return;
  const d = e.target.closest && e.target.closest('[data-drop]');
  clearDropHot();
  let target = d ? d.dataset.drop : null;
  if (!target && main.contains(e.target) && isFolderId(T().loc) && !T().q){ target = T().loc; if (dropOk(target)){ main.classList.add('drop-hot'); e.preventDefault(); e.dataTransfer.dropEffect = ext || e.altKey || e.ctrlKey ? 'copy' : 'move'; } return; }
  if (target && dropOk(target)){ e.preventDefault(); d.classList.add('drop-hot'); e.dataTransfer.dropEffect = ext || ((e.altKey || e.ctrlKey) && isFolderId(target)) ? 'copy' : 'move'; }
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) clearDropHot(); });
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('[data-drop]');
  let target = d ? d.dataset.drop : (main.contains(e.target) && isFolderId(T().loc) && !T().q ? T().loc : null);
  clearDropHot();
  if (!target) return;
  e.preventDefault();
  if (S.drag){
    const ids = S.drag; S.drag = null;
    if (target === 'trash') trash(ids);
    else if (target === 'starred'){ const ns = ids.map(i => N[i]); if (!ns.every(n => n.starred)) toggleStar(ids); }
    else if (target.startsWith('tag:')){ const tg = target.slice(4); if (!ids.every(i => N[i].tags.includes(tg))) toggleTag(ids, tg); toast(`Tagged ${ids.length === 1 ? '“' + N[ids[0]].name + '”' : ids.length + ' items'} ${locName(target)}`); }
    else moveItems(ids, target, e.altKey || e.ctrlKey);
    render();
  } else if (e.dataTransfer.files && e.dataTransfer.files.length && isFolderId(target)) importFiles(e.dataTransfer.files, target, false);
});
$('#fileIn').addEventListener('change', e => { importFiles(e.target.files, currentFolder(), false); e.target.value = ''; });
$('#dirIn').addEventListener('change', e => { importFiles(e.target.files, currentFolder(), true); e.target.value = ''; });

// Inspector editor
let edT = 0;
document.addEventListener('input', e => {
  if (e.target.id !== 'editor') return;
  const n = N[e.target.dataset.id]; if (!n) return;
  n.content = e.target.value; n.size = new Blob([n.content]).size; n.modified = Date.now();
  const s = $('#pvSize'); if (s) s.textContent = fmtSize(n.size);
  const sv = $('#pvSaved'); if (sv) sv.textContent = 'Saving…';
  clearTimeout(edT); edT = setTimeout(() => { saveNow(); const sv2 = $('#pvSaved'); if (sv2) sv2.textContent = 'Saved'; }, 400);
});
document.addEventListener('focusout', e => { if (e.target.id === 'editor') renderStatus(); });

// Keyboard
function gridCols(){
  if (S.view !== 'grid' || main.classList.contains('mode-columns')) return 1;
  const g = main.querySelector('.grid'); if (!g) return 1;
  return getComputedStyle(g).gridTemplateColumns.split(' ').length;
}
function moveFocus(delta, extend){
  if (!ITEMS.length) return;
  let i = ITEMS.findIndex(n => n.id === (S.focus || [...S.sel].pop()));
  i = i < 0 ? (delta > 0 ? 0 : ITEMS.length - 1) : Math.max(0, Math.min(ITEMS.length - 1, i + delta));
  const id = ITEMS[i].id;
  if (extend && S.anchor){
    const a = ITEMS.findIndex(n => n.id === S.anchor); S.sel.clear();
    for (let k = Math.min(a, i); k <= Math.max(a, i); k++) S.sel.add(ITEMS[k].id);
  } else { S.sel = new Set([id]); S.anchor = id; }
  S.focus = id; render();
}
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey; const k = e.key;
  if (!pal.hidden){
    if (k === 'Escape'){ e.preventDefault(); closePalette(); }
    else if (k === 'ArrowDown'){ e.preventDefault(); palSel = Math.min(palRows.length - 1, palSel + 1); renderPalette(); }
    else if (k === 'ArrowUp'){ e.preventDefault(); palSel = Math.max(0, palSel - 1); renderPalette(); }
    else if (k === 'Enter'){ e.preventDefault(); runPal(palSel); }
    return;
  }
  if (!$('#modal').hidden){ if (k === 'Escape') closeModal(); return; }
  if (mod && k.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); return; }
  if (!ctx.hidden && k === 'Escape'){ hideMenu(); return; }
  if (e.target.matches('input, textarea, select, [contenteditable="true"]')){ if (k === 'Escape' && e.target.id === 'editor') { e.target.blur(); main.focus(); } return; }
  const sel = [...S.sel];
  const inTrash = T().loc === 'trash';
  if (mod && k === '1'){ e.preventDefault(); return act('view', 'grid'); }
  if (mod && k === '2'){ e.preventDefault(); return act('view', 'list'); }
  if (mod && k === '3'){ e.preventDefault(); return act('view', 'columns'); }
  if (mod && e.shiftKey && k.toLowerCase() === 'n'){ e.preventDefault(); if (isFolderId(T().loc)) newFolder(); return; }
  if (mod && k.toLowerCase() === 'a'){ e.preventDefault(); S.sel = new Set(ITEMS.map(n => n.id)); render(); return; }
  if (mod && k.toLowerCase() === 'z'){ e.preventDefault(); return undo(); }
  if (mod && k.toLowerCase() === 'c' && sel.length){ e.preventDefault(); return setClip('copy'); }
  if (mod && k.toLowerCase() === 'x' && sel.length){ e.preventDefault(); return setClip('cut'); }
  if (mod && k.toLowerCase() === 'v'){ e.preventDefault(); return paste(); }
  if (mod && k.toLowerCase() === 'd' && sel.length){ e.preventDefault(); return duplicate(sel); }
  if (mod && k.toLowerCase() === 'f'){ e.preventDefault(); sIn.focus(); sIn.select(); return; }
  if (e.altKey && k === 'ArrowLeft'){ e.preventDefault(); return histStep(-1); }
  if (e.altKey && k === 'ArrowRight'){ e.preventDefault(); return histStep(1); }
  if (e.altKey && k === 'ArrowUp'){ e.preventDefault(); return goUp(); }
  if (e.altKey && k.toLowerCase() === 't'){ e.preventDefault(); return act('newtab'); }
  if (e.altKey && k.toLowerCase() === 'w'){ e.preventDefault(); if (S.tabs.length > 1) act('closetab', S.tab); return; }
  if (mod || e.altKey) return;
  const cols = gridCols();
  switch (k){
    case 'ArrowRight':
      e.preventDefault();
      if (cols > 1) moveFocus(1, e.shiftKey);
      else if (S.view === 'columns' && sel.length === 1 && N[sel[0]].type === 'folder') open(sel[0]);
      return;
    case 'ArrowLeft':
      e.preventDefault();
      if (cols > 1) moveFocus(-1, e.shiftKey);
      else if (S.view === 'columns') goUp();
      return;
    case 'ArrowDown': e.preventDefault(); moveFocus(cols, e.shiftKey); return;
    case 'ArrowUp': e.preventDefault(); moveFocus(-cols, e.shiftKey); return;
    case 'Home': e.preventDefault(); if (ITEMS.length){ S.sel = new Set([ITEMS[0].id]); S.focus = S.anchor = ITEMS[0].id; render(); } return;
    case 'End': e.preventDefault(); if (ITEMS.length){ const l = ITEMS[ITEMS.length - 1].id; S.sel = new Set([l]); S.focus = S.anchor = l; render(); } return;
    case 'Enter': e.preventDefault(); if (sel.length === 1) open(sel[0]); else if (sel.length){ const f = sel.find(id => N[id].type === 'folder'); if (f) open(f); } return;
    case 'Backspace': e.preventDefault(); goUp(); return;
    case 'Delete': e.preventDefault(); if (sel.length) inTrash ? confirmDelete(sel) : trash(sel); return;
    case 'F2': e.preventDefault(); if (sel.length === 1) startRename(sel[0]); return;
    case 'Escape': if (T().q){ act('clear-search'); } else { S.sel.clear(); S.focus = null; render(); } return;
    case ' ': e.preventDefault(); act('preview'); return;
    case '/': e.preventDefault(); sIn.focus(); sIn.select(); return;
  }
  if (sel.length && !inTrash){
    if (k === 's' || k === 'S'){ e.preventDefault(); return toggleStar(sel); }
    if (/^[1-6]$/.test(k)){ e.preventDefault(); return toggleTag(sel, TAGS[+k - 1].id); }
  }
  if (k.length === 1 && /\S/.test(k) && !/^[1-6]$/.test(k) && k !== 's' && k !== 'S'){
    clearTimeout(S.typeT); S.typeBuf += k.toLowerCase(); S.typeT = setTimeout(() => S.typeBuf = '', 800);
    const hit = ITEMS.find(n => n.name.toLowerCase().startsWith(S.typeBuf));
    if (hit){ S.sel = new Set([hit.id]); S.focus = S.anchor = hit.id; render(); }
  }
});
window.addEventListener('resize', () => { if (innerWidth <= 760) return; app.classList.remove('side-open'); });

/* ---------- Boot ---------- */
if (!load()) resetData();
if (!S.tabs.length){ S.tabs = [newTab(ROOT)]; S.tab = 0; }
if (innerWidth <= 1080) S.preview = false;
render();
main.focus({preventScroll:true});
})();
</script>
