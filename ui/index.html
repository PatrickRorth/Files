<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<style>
/* Layout: title bar across the top (brand, tabs, window controls), then sidebar | content | inspector */
:root{
  --bg:#FCFDFE; --side:#F3F5F9; --raise:#FFFFFF; --title:#E9EDF4;
  --fg:#161A22; --fg2:#566070; --fg3:#8A92A3; --line:#E4E8EF; --line2:#D2D8E2;
  --hover:#E9EDF5; --accent:#3552D6; --accent-fg:#FFFFFF; --accent-soft:#E8EDFD; --sel:#DEE6FE; --sel-line:#9EB1F5;
  --danger:#C92A4B; --close:#C42B1C; --label-fg:#FFFFFF; --mark:#FFE59A; --warn:#D9480F;
  --k-folder:#4C6EF5; --k-image:#0B8A9A; --k-video:#D9720B; --k-audio:#C2255C; --k-pdf:#D63B2F; --k-doc:#2F6FDE;
  --k-sheet:#2B8A3E; --k-slides:#E8590C; --k-code:#7048E8; --k-text:#5C6577; --k-archive:#8C6D46; --k-app:#0F766E; --k-other:#7A8394;
  --t-red:#E03131; --t-orange:#E8830C; --t-yellow:#D4A20B; --t-green:#2F9E44; --t-blue:#1C7ED6; --t-purple:#9C36B5;
  --pop:0 12px 40px -10px rgb(15 20 40 / .30), 0 0 0 1px var(--line2);
  --f-ui:"Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --f-display:"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --r:10px; --tb:40px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12151C; --side:#0E1117; --raise:#191D26; --title:#0A0C11;
  --fg:#E6E9EF; --fg2:#A3AAB8; --fg3:#6B7385; --line:#222733; --line2:#2F3543;
  --hover:#1E232E; --accent:#8399FF; --accent-fg:#0B1030; --accent-soft:#1C2444; --sel:#212C54; --sel-line:#4D62B4;
  --danger:#FF6B86; --label-fg:#0D1018; --mark:#6B5A12; --warn:#FF922B;
  --k-folder:#7B93FF; --k-image:#3BC9DB; --k-video:#FFA94D; --k-audio:#F06595; --k-pdf:#FF7B6B; --k-doc:#6FA2FF;
  --k-sheet:#51CF66; --k-slides:#FF922B; --k-code:#A48BFF; --k-text:#A0A8B8; --k-archive:#C9A87A; --k-app:#38D9A9; --k-other:#9AA2B2;
  --t-red:#FF6B6B; --t-orange:#FFA94D; --t-yellow:#FFD43B; --t-green:#69DB7C; --t-blue:#4DABF7; --t-purple:#DA77F2;
  --pop:0 12px 40px -10px rgb(0 0 0 / .7), 0 0 0 1px var(--line2);
  color-scheme:dark;
}}
/* Theme chosen in Settings overrides the system setting */
:root[data-theme="dark"]{
  --bg:#12151C; --side:#0E1117; --raise:#191D26; --title:#0A0C11;
  --fg:#E6E9EF; --fg2:#A3AAB8; --fg3:#6B7385; --line:#222733; --line2:#2F3543;
  --hover:#1E232E; --accent:#8399FF; --accent-fg:#0B1030; --accent-soft:#1C2444; --sel:#212C54; --sel-line:#4D62B4;
  --danger:#FF6B86; --label-fg:#0D1018; --mark:#6B5A12; --warn:#FF922B;
  --k-folder:#7B93FF; --k-image:#3BC9DB; --k-video:#FFA94D; --k-audio:#F06595; --k-pdf:#FF7B6B; --k-doc:#6FA2FF;
  --k-sheet:#51CF66; --k-slides:#FF922B; --k-code:#A48BFF; --k-text:#A0A8B8; --k-archive:#C9A87A; --k-app:#38D9A9; --k-other:#9AA2B2;
  --t-red:#FF6B6B; --t-orange:#FFA94D; --t-yellow:#FFD43B; --t-green:#69DB7C; --t-blue:#4DABF7; --t-purple:#DA77F2;
  --pop:0 12px 40px -10px rgb(0 0 0 / .7), 0 0 0 1px var(--line2);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:default;padding:0}
input,textarea{font:inherit;color:inherit;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
.ic{width:16px;height:16px;flex:none}
/* Scrollbars: thin rounded thumb, no arrows, transparent track */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background-color:color-mix(in srgb, var(--fg3) 40%, transparent);border:3.5px solid transparent;background-clip:content-box;border-radius:8px;min-height:36px}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb, var(--fg3) 70%, transparent);border-width:2.5px}
::-webkit-scrollbar-thumb:active{background-color:var(--accent)}
.side-scroll::-webkit-scrollbar,.pv-body::-webkit-scrollbar,.col::-webkit-scrollbar,.ctx::-webkit-scrollbar,.pal-list::-webkit-scrollbar{width:9px}
.side-scroll::-webkit-scrollbar-thumb,.pv-body::-webkit-scrollbar-thumb,.col::-webkit-scrollbar-thumb{background-color:transparent;border-width:2.5px}
.side-scroll:hover::-webkit-scrollbar-thumb,.pv-body:hover::-webkit-scrollbar-thumb,.col:hover::-webkit-scrollbar-thumb{background-color:color-mix(in srgb, var(--fg3) 40%, transparent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr) 300px;grid-template-rows:var(--tb) minmax(0,1fr);position:relative}
.app.no-preview{grid-template-columns:232px minmax(0,1fr)}
.app.no-preview .preview{display:none}

/* Title bar */
.titlebar{grid-column:1/-1;display:flex;align-items:stretch;background:var(--title);border-bottom:1px solid var(--line);min-width:0}
.brand{width:232px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#5F7AF0,#2E48C8);display:grid;place-items:center;color:#fff;pointer-events:none}
.brand-mark svg{width:14px;height:14px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:14px;pointer-events:none}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 4px 0;min-width:0;flex:0 1 auto;overflow:hidden}
.tab{display:flex;align-items:center;gap:7px;height:33px;padding:0 6px 0 11px;border-radius:8px 8px 0 0;color:var(--fg2);width:190px;min-width:90px;flex:0 1 190px;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--bg);color:var(--fg);border-color:var(--line)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tab .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;opacity:.6;flex:none}
.tab .x:hover{background:var(--line2);opacity:1}
.tab .x .ic{width:12px;height:12px}
.tab-new{width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--fg3);margin:0 0 3px 2px;flex:none;align-self:flex-end}
.tab-new:hover{background:var(--hover);color:var(--fg)}
.drag{flex:1;min-width:24px}
.tbtn{width:40px;height:100%;display:grid;place-items:center;color:var(--fg2);flex:none}
.tbtn:hover{background:var(--hover);color:var(--fg)}
.winctl{display:flex;flex:none}
/* Settings */
.settings{background:var(--raise);border-radius:14px;box-shadow:var(--pop);width:min(600px, 100%);max-height:78vh;display:flex;flex-direction:column;overflow:hidden}
.set-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px 22px;border-bottom:1px solid var(--line)}
.set-head h2{margin:0;font-family:var(--f-display);font-weight:650;font-size:19px}
.set-body{overflow:auto;padding:6px 22px 20px;display:flex;flex-direction:column}
.set-sec{display:flex;flex-direction:column;padding-top:14px}
.set-sec > .slabel{padding:0 0 6px}
.set-row{display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .txt{flex:1;min-width:0}
.set-row .txt b{display:block;font-weight:600}
.set-row .txt span{display:block;color:var(--fg2);font-size:12.5px;margin-top:1px}
.set-row .seg button{width:auto;padding:0 10px;font-size:12.5px}
.switch{width:36px;height:20px;border-radius:10px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--raise);box-shadow:0 1px 2px rgb(0 0 0 / .3);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.set-foot{color:var(--fg3);font-size:12px;padding-top:14px}
/* Compact density */
.app.compact .lrow{height:28px}
.app.compact .citem{height:26px}
.app.compact .sitem{padding-top:4px;padding-bottom:4px}
.app.compact .tile{padding:8px 6px 7px;gap:5px}
.app.compact .tile .thumb{height:60px}
.app.compact .grid{grid-template-columns:repeat(auto-fill, minmax(100px, 1fr))}
/* Only the big icon-view tiles shrink; small icons in Details, Columns and the palette keep their size. */
.app.compact .tile .thumb > .g-folder{width:58px;height:46px}
.app.compact .tile .thumb > .g-thumb{width:84px;height:60px}
.winctl button{width:46px;height:100%;display:grid;place-items:center;color:var(--fg)}
.winctl button:hover{background:var(--hover)}
.winctl button.close:hover{background:var(--close);color:#fff}
.winctl svg{width:10px;height:10px}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.slabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600;padding:0 8px 4px}
.sgroup{display:flex;flex-direction:column;gap:1px}
.slabel.fold{display:flex;align-items:center;gap:4px;width:100%;background:none;border:0;cursor:pointer;text-align:left;font-family:inherit;border-radius:5px;padding-top:2px;padding-bottom:4px}
.slabel.fold:hover{color:var(--fg2)}
.slabel.fold .ic{width:10px;height:10px;opacity:0;transform:rotate(90deg);transition:transform .15s,opacity .15s}
.slabel.fold:hover .ic,.slabel.fold:focus-visible .ic,.sgroup.shut .slabel.fold .ic{opacity:.8}
.sgroup.shut .slabel.fold .ic{transform:none}
.sitem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:var(--fg2);text-align:left;width:100%}
.sitem:hover{background:var(--hover);color:var(--fg)}
.sitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sitem .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .cnt{font-family:var(--f-mono);font-size:11px;color:var(--fg3)}
.sitem .tw{width:16px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--fg3);flex:none;margin-right:-4px;transition:transform .12s ease}
.sitem .tw:hover{background:var(--line2);color:var(--fg)}
.sitem .tw.open{transform:rotate(90deg)}
.sitem .tw.none{visibility:hidden}
.sitem .tw .ic{width:11px;height:11px}
.tload{font-size:11.5px;color:var(--fg3);padding:4px 0}
.sitem .mini{width:34px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden;flex:none}
.sitem .mini i{display:block;height:100%;background:var(--accent)}
.sitem .mini.full i{background:var(--warn)}
.tdot{width:9px;height:9px;border-radius:50%;flex:none;margin:0 3.5px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.toggle{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:7px;color:var(--fg2);width:100%;text-align:left}
.toggle:hover{background:var(--hover);color:var(--fg)}
.toggle .sw{margin-left:auto;width:30px;height:17px;border-radius:9px;background:var(--line2);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--raise);box-shadow:0 1px 2px rgb(0 0 0 / .3);transition:transform .15s}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{transform:translateX(13px)}

/* Center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex:none}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg2);flex:none}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.iconbtn:disabled{opacity:.35}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
.navgrp{display:flex;gap:2px}
#bMenu{display:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--side);padding:0 4px;overflow:hidden;cursor:text}
.crumbs-in{display:flex;align-items:center;min-width:0;overflow:hidden}
.crumb{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:6px;color:var(--fg2);white-space:nowrap;min-width:0;flex-shrink:1;overflow:hidden;text-overflow:ellipsis}
.crumb:last-child{color:var(--fg);font-weight:600;flex-shrink:0}
.crumb:hover{background:var(--hover);color:var(--fg)}
.crumb .ic{width:14px;height:14px}
.csep{color:var(--fg3);flex:none;display:grid;place-items:center;width:18px;height:22px;border-radius:5px}
.csep:hover{background:var(--hover);color:var(--fg)}
.csep .ic{width:12px;height:12px}
.crumbs input{flex:1;border:0;background:none;outline:none;font-family:var(--f-mono);font-size:12.5px;padding:0 6px;min-width:0}
.search{position:relative;width:min(300px, 34%);min-width:170px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg3)}
.search input{width:100%;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--side);padding:0 10px 0 32px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft)}
kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--fg3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--raise);line-height:16px;white-space:nowrap}

.lochead{display:flex;align-items:flex-end;gap:12px;padding:4px 18px 12px;flex:none;flex-wrap:wrap}
.loctitle{flex:1;min-width:180px}
.loctitle h1{font-family:var(--f-display);font-weight:650;font-size:25px;letter-spacing:-.01em;margin:0;line-height:1.15;overflow-wrap:anywhere}
.locsum{display:flex;align-items:center;gap:10px;margin-top:5px;color:var(--fg2);font-size:12.5px;flex-wrap:wrap}
.locctl{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--fg3)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.btn.sm{height:27px;padding:0 9px;font-size:12px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;background:var(--side)}
.seg button{width:28px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--fg2)}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12), 0 0 0 1px var(--line2)}
.notice{display:flex;gap:8px;align-items:center;padding:0 18px 10px;color:var(--fg2);font-size:12.5px;flex:none;flex-wrap:wrap}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.main{flex:1;overflow:auto;position:relative;padding:0 14px 20px;min-height:0;outline:none}
.main.mode-columns{overflow:hidden;padding:0}
.main.drop-hot{background:var(--accent-soft)}
.status{display:flex;align-items:center;gap:14px;padding:0 16px;height:28px;border-top:1px solid var(--line);color:var(--fg3);font-size:12px;flex:none;white-space:nowrap;overflow:hidden}
.status .grow{flex:1}
.status b{color:var(--fg2);font-weight:500}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(118px, 1fr));gap:6px;padding:2px 4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 8px 10px;border-radius:var(--r);border:1px solid transparent;position:relative;min-width:0}
.tile:hover{background:var(--hover)}
.tile .thumb{height:78px;width:100%;display:grid;place-items:center}
.tile .nm{font-weight:500;text-align:center;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;padding:1px 4px;border-radius:4px}
.tile .meta{font-size:11.5px;color:var(--fg3);margin-top:-4px}
.tile .badges{position:absolute;top:8px;right:8px;display:flex;gap:3px;align-items:center}
.badges .tdot{width:8px;height:8px;margin:0;box-shadow:0 0 0 2px var(--bg)}
.star-badge{color:var(--t-yellow);display:inline-grid}
.star-badge .ic{width:13px;height:13px;fill:currentColor}
.item.ghosted{opacity:.55}
.item.sel{background:var(--sel);border-color:var(--sel-line)}
.item.focus{outline:2px solid var(--accent);outline-offset:-2px}
.item.cut{opacity:.42}
.drop-hot{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent)}
.g-folder{width:70px;height:56px}
.g-page{width:48px;height:60px}
.g-drive{width:64px;height:40px}
.g-img{width:100px;height:74px;border-radius:6px;overflow:hidden;position:relative;background:var(--line);box-shadow:0 0 0 1px var(--line2)}
.g-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g-img.bad img{display:none}
/* Every thumbnail sits in the same fixed frame; the picture fills it (cropped), icons sit centered. */
.g-thumb{width:100px;height:76px;display:grid;place-items:center;position:relative;flex:none}
.g-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
.g-thumb.ok img{opacity:1}
.g-thumb.ok .fb{display:none}
.g-thumb .fb{display:grid;place-items:center;position:absolute;inset:0}
.g-thumb .fb > .g-thumb{width:100%;height:100%}
.g-thumb.ok:not(.icon){border-radius:7px;overflow:hidden;background:var(--line);box-shadow:0 0 0 1px var(--line2), 0 3px 8px -3px rgb(0 0 0 / .35)}
.g-thumb.doc.ok{background:#fff}
.g-thumb.doc img{object-position:top center}
.g-thumb.icon img{inset:auto;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%, -50%);object-fit:contain}
.sg .g-thumb, .pi .g-thumb{width:100%;height:100%}
.sg .g-thumb.icon img{width:20px;height:20px}
.sg .g-thumb .g-page{width:18px;height:23px}
.pv-stage .g-thumb{width:100%;height:240px}
.pv-stage .g-thumb.ok:not(.icon){background:transparent;box-shadow:none;border-radius:0}
.pv-stage .g-thumb img{object-fit:contain}
.pv-stage .g-thumb.icon img{width:110px;height:110px}
/* Submenus and Windows items in our menu */
.mi .mchev{display:grid;color:inherit;opacity:.6;margin-left:6px}
.mi .mchev .ic{width:12px;height:12px}
.mi.open{background:var(--hover)}
.mload{display:flex;align-items:center;gap:10px;height:30px;padding:0 9px;color:var(--fg3);font-size:12.5px}
.ctx{max-width:min(380px, 90vw)}

/* This PC */
.pc{display:flex;flex-direction:column;gap:22px;padding:4px 4px 0}
.pc .slabel{padding:0 4px 8px}
.drives{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:8px}
.dcard{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--side);min-width:0}
.dcard:hover{background:var(--hover)}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmeta{font-size:12px;color:var(--fg2)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line2)}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--warn)}

/* List */
.list{display:flex;flex-direction:column;min-width:0}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 170px 140px 90px 60px;align-items:center;gap:12px;padding:0 10px;height:34px;border-radius:7px;border:1px solid transparent;min-width:0}
.list.wide .lrow{grid-template-columns:minmax(0,1fr) minmax(0,240px) 140px 90px 60px}
.lrow:not(.lhead):hover{background:var(--hover)}
.lhead{position:sticky;top:0;background:var(--bg);z-index:2;height:32px;color:var(--fg3);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px}
.lhead button{display:flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.lhead button:hover,.lhead button.on{color:var(--fg)}
.lhead .ic{width:12px;height:12px}
.lname{display:flex;align-items:center;gap:10px;min-width:0}
.sg{width:26px;height:24px;display:grid;place-items:center;flex:none}
.sg .g-folder{width:24px;height:20px}
.sg .g-page{width:18px;height:23px}
.sg .g-drive{width:24px;height:16px}
.lname .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.lcell{color:var(--fg2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcell.r{text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.ltags{display:flex;gap:3px;align-items:center;justify-content:flex-end}
.ltags .tdot{margin:0;width:8px;height:8px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.more{display:flex;justify-content:center;padding:14px}

/* Columns */
.cols{display:flex;height:100%;overflow-x:auto;overflow-y:hidden}
.col{width:250px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:6px}
.citem{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;border:1px solid transparent;min-width:0}
.citem:hover{background:var(--hover)}
.citem.path{background:var(--line)}
.citem .sg{width:22px}
.citem .sg .g-folder{width:20px;height:16px}
.citem .sg .g-page{width:15px;height:19px}
.citem .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.citem .chev{color:var(--fg3);display:grid}
.citem .chev .ic{width:12px;height:12px}
.col-empty{color:var(--fg3);font-size:12px;padding:12px}

.rename{font:inherit;font-weight:500;border:1px solid var(--accent);border-radius:4px;background:var(--bg);outline:none;padding:1px 4px;width:100%;box-shadow:0 0 0 3px var(--accent-soft);text-align:inherit;min-width:0}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:70px 20px;color:var(--fg2)}
.empty .eic{width:56px;height:56px;border-radius:16px;background:var(--side);border:1px dashed var(--line2);display:grid;place-items:center;color:var(--fg3);margin-bottom:6px}
.empty .eic .ic{width:24px;height:24px}
.empty h3{margin:0;font-family:var(--f-display);font-weight:650;font-size:17px;color:var(--fg)}
.empty p{margin:0;max-width:46ch}
.empty .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}

.marquee{position:fixed;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent);border-radius:3px;pointer-events:none;z-index:50}
.dragghost{position:fixed;z-index:200;pointer-events:none;background:var(--raise);box-shadow:var(--pop);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.dragghost .act{color:var(--accent);font-weight:600}

/* Inspector */
.preview{border-left:1px solid var(--line);background:var(--side);display:flex;flex-direction:column;min-height:0}
.pv-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 16px;color:var(--fg3);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.pv-body{flex:1;overflow:auto;padding:10px 16px 18px;display:flex;flex-direction:column;gap:16px}
.pv-stage{border-radius:12px;background:var(--bg);border:1px solid var(--line);min-height:160px;display:grid;place-items:center;padding:16px;overflow:hidden}
.pv-stage .g-folder{width:110px;height:88px}
.pv-stage .g-page{width:84px;height:105px}
.pv-stage .g-drive{width:120px;height:75px}
.pv-stage img, .pv-stage video{max-width:100%;max-height:300px;border-radius:6px;display:block}
.pv-stage audio{width:100%}
.pv-stage.pdf{padding:0;min-height:340px;display:block}
.pv-stage.pdf iframe{width:100%;height:340px;border:0;display:block}
.textpv{margin:0;max-height:340px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:11.5px;line-height:1.55;white-space:pre;user-select:text;tab-size:2}
.pv-name{font-family:var(--f-display);font-weight:650;font-size:18px;line-height:1.25;overflow-wrap:anywhere;margin:0;user-select:text}
.pv-kind{color:var(--fg2);font-size:12.5px;margin-top:3px}
.pv-actions{display:flex;gap:6px;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:12.5px;margin:0}
.dl dt{color:var(--fg3)}
.dl dd{margin:0;color:var(--fg);overflow-wrap:anywhere;user-select:text}
.dl dd a{color:var(--accent);cursor:pointer;text-decoration:none}
.dl dd a:hover{text-decoration:underline}
.pv-sec{display:flex;flex-direction:column;gap:8px}
.pv-sec > .slabel{padding:0}
.tagpick{display:flex;flex-wrap:wrap;gap:5px}
.tagpick button{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px 0 6px;border-radius:12px;border:1px solid var(--line2);font-size:11.5px;color:var(--fg2)}
.tagpick button .tdot{margin:0;width:8px;height:8px}
.tagpick button.on{background:var(--raise);color:var(--fg);border-color:var(--fg3);font-weight:600}
.stack{position:relative;width:130px;height:110px}
.stack > div{position:absolute;inset:0;display:grid;place-items:center}
.pv-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--fg3);gap:10px;padding:30px 10px}
.kbdlist{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px;color:var(--fg2);text-align:left;margin-top:8px}

/* Menus, toast, modal, palette */
.ctx{position:fixed;z-index:100;min-width:220px;max-height:70vh;overflow:auto;background:var(--raise);border-radius:10px;box-shadow:var(--pop);padding:5px;display:flex;flex-direction:column}
.mi{display:flex;align-items:center;gap:10px;min-height:30px;padding:0 9px;border-radius:6px;text-align:left;color:var(--fg);white-space:nowrap}
.mi:hover:not(:disabled){background:var(--accent);color:var(--accent-fg)}
.mi:hover kbd{color:inherit;background:transparent;border-color:currentColor;opacity:.75}
.mi:disabled{opacity:.4}
.mi span{flex:1;overflow:hidden;text-overflow:ellipsis}
.mi.danger{color:var(--danger)}
.mi.danger:hover{background:var(--danger);color:var(--bg)}
.msep{height:1px;background:var(--line);margin:4px 2px;flex:none}
.mtags{display:flex;gap:8px;padding:6px 9px}
.mtags button{width:16px;height:16px;border-radius:50%}
.mtags button.on{box-shadow:0 0 0 2px var(--raise), 0 0 0 3.5px currentColor}
.mlabel{font-size:10.5px;color:var(--fg3);padding:6px 9px 2px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
#toast{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;box-shadow:var(--pop);pointer-events:auto;font-size:13px;animation:tin .18s ease-out;max-width:min(520px, 80vw)}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.scrim{position:fixed;inset:0;background:rgb(10 14 24 / .35);z-index:90;display:grid;place-items:start center;padding:12vh 16px 16px}
.modal{background:var(--raise);border-radius:14px;box-shadow:var(--pop);width:min(440px, 100%);padding:20px;display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0;font-family:var(--f-display);font-weight:650;font-size:18px;overflow-wrap:anywhere}
.modal p{margin:0;color:var(--fg2)}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.palette{background:var(--raise);border-radius:14px;box-shadow:var(--pop);width:min(600px, 100%);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--fg3)}
.pal-in input{flex:1;height:50px;border:0;background:none;outline:none;font-size:15px;color:var(--fg)}
.pal-list{overflow:auto;padding:6px}
.pal-list .mlabel{padding:8px 10px 4px}
.pi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;width:100%;text-align:left;min-width:0}
.pi .sg{width:22px}
.pi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .p{color:var(--fg3);font-size:11.5px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.pi.hl{background:var(--accent-soft)}
.pi.hl .t{color:var(--accent);font-weight:600}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg3)}
.side-scrim{display:none}

@media (max-width: 1080px){
  .app, .app.no-preview{grid-template-columns:220px minmax(0,1fr)}
  .brand{width:220px}
  .preview{position:absolute;right:0;top:var(--tb);bottom:0;width:min(340px, 92%);z-index:60;box-shadow:var(--pop)}
}
@media (max-width: 820px){
  .app, .app.no-preview{grid-template-columns:minmax(0,1fr)}
  .brand{width:auto}
  .side{position:absolute;left:0;top:var(--tb);bottom:0;width:min(270px, 86%);z-index:70;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--pop)}
  .app.side-open .side{transform:none}
  .app.side-open .side-scrim{display:block;position:absolute;inset:var(--tb) 0 0 0;background:rgb(10 14 24 / .3);z-index:65}
  #bMenu{display:grid}
  .lrow, .list.wide .lrow{grid-template-columns:minmax(0,1fr) 80px 40px}
  .lrow .c-a, .lrow .c-b{display:none}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

</div>

/* ---------- Loading ---------- */
async function loadPlaces(){ try { S.places = await invoke('places'); } catch { S.places = []; } }
async function loadDrives(){ try { S.drives = await invoke('drives'); } catch { S.drives = []; } }
let tok = 0;
async function refresh(opt = {}){
  const t = T(), my = ++tok, loc = t.loc, q = t.q.trim();
  S.loading = true;
  if (!opt.keep){ S.sel.clear(); S.focus = null; S.anchor = null; S.renaming = null; }
  if (!opt.quiet) renderLoading();
  let raw = [], err = null;
  try {
    if (loc === PC){
      await loadDrives();
      raw = [...S.places.map(p => ({name:p.name, path:p.path, dir:true, place:p.id, size:0, modified:0})),
             ...S.drives.map(d => ({name:driveName(d), path:d.path, dir:true, drive:d, size:0, modified:0}))];
    } else if (loc === STARRED) raw = await invoke('stat_many', {paths:Object.keys(S.stars)});
    else if (loc === RECENT) raw = await invoke('stat_many', {paths:S.recent});
    else if (loc.startsWith('::tag:')){ const tg = loc.slice(6); raw = await invoke('stat_many', {paths:Object.keys(S.tags).filter(p => S.tags[p].includes(tg))}); }
    else if (loc === TRASH) raw = (await invoke('trash_list')).map(x => ({name:x.name, path:join(x.original, x.name), key:'trash:' + x.id, trashId:x.id, original:x.original, dir:false, size:0, modified:x.deleted}));
    else if (q) raw = await invoke('search', {root:loc, query:q, showHidden:S.hidden});
    else { raw = await invoke('list_dir', {path:loc}); S.cache.set(lc(loc), raw); }
    if (q && !isPath(loc)){ const terms = q.toLowerCase().split(/\s+/); raw = raw.filter(e => terms.every(w => e.name.toLowerCase().includes(w))); }
  } catch (e){ err = String((e && e.message) || e); }
  if (my !== tok) return;
  raw.forEach(e => { if (!e.key) e.key = e.path; });
  const sig = loc + '\n' + raw.map(e => e.key + '|' + e.size + '|' + e.modified + '|' + (e.hidden ? 1 : 0)).join('\n');
  if (opt.quiet && opt.keep && !err && sig === S.rawSig){ S.loading = false; renderStatus(); renderNotice(); return; }
  S.rawSig = sig;

  const watchPath = isPath(loc) && !q && !err ? loc : null;
  if (watchPath !== S.watching){ S.watching = watchPath; invoke('watch_dir', {path:watchPath}).catch(() => {}); }
  S.raw = raw; S.error = err; S.loading = false;

}
function renderLoading(){ renderStatus(); renderNotice(); }

/* ---------- Items ---------- */
const collator = new Intl.Collator(undefined, {numeric:true, sensitivity:'base'});
const visibleEntry = e => S.hidden || !(e.hidden || e.system);
function sortItems(list){
  const {k, d} = S.sort;
  return list.slice().sort((a, b) => {
    if (SET.foldersFirst && a.dir !== b.dir) return a.dir ? -1 : 1;
    let r = 0;
    if (k === 'modified') r = (a.modified || 0) - (b.modified || 0);
    else if (k === 'size') r = (a.size || 0) - (b.size || 0);
    else if (k === 'kind') r = collator.compare(KIND_LABEL[kindOf(a)], KIND_LABEL[kindOf(b)]) || collator.compare(ext(a.name), ext(b.name));
    if (!r) r = collator.compare(a.name, b.name);

}
function getItems(){
  const t = T();
  if (t.loc === PC && !t.q) return S.raw;
  let list = S.raw.filter(visibleEntry);
  if (t.loc === RECENT && !t.q) return list;
  if (t.loc === TRASH && S.sort.k === 'name' && !t.q) return list.slice().sort((a, b) => b.modified - a.modified);
  return sortItems(list);
}

/* ---------- Rendering ---------- */
const app = $('#app'), main = $('#main');

  if (S.focus && !BY.has(S.focus)) S.focus = null;
  app.classList.toggle('no-preview', !S.preview);
  renderSide(); renderTabs(); renderToolbar(); renderHead(); renderNotice(); renderMain(); renderPreview(); renderStatus();
}

const treeSort = list => list.slice().sort((a, b) => collator.compare(a.name, b.name));

function renderSide(){

    }

        ${pins.map(p => row(p, baseName(p) || p, ic('pin'), {tree:true})).join('')}

        row(TRASH, 'Recycle Bin', ic('trash'))) : ''}

function renderTabs(){

function itemAttrs(e, cls){

}

function renderMain(){

function renderColumns(){

function afterMainRender(){

/* ---------- Menus ---------- */
// Menus are a stack: level 0 is the menu itself, deeper levels are open submenus.
let menus = [];
const menuOpen = () => menus.length > 0;
const inMenu = el => menus.some(m => m.el.contains(el));
function closeMenus(from = 0){
  while (menus.length > from){ const m = menus.pop(); clearTimeout(m.hoverT); m.el.remove(); }
}
function hideMenu(){ closeMenus(0); }
function showMenu(x, y, items, level = 0, anchor = null){
  closeMenus(level);
  const el = document.createElement('div');
  el.className = 'ctx'; el.setAttribute('role', 'menu');
  el.innerHTML = items.map((it, i) => {
    if (it === '-') return '<div class="msep"></div>';
    if (it.header) return `<div class="mlabel">${esc(it.label)}</div>`;
    if (it.loading) return `<div class="mload"><span class="spin"></span>${esc(it.label)}</div>`;
    if (it.tags) return `<div class="mtags">${TAGS.map(t => `<button style="background:var(--t-${t.id});color:var(--t-${t.id})" class="${it.es.every(e => tagsOf(e.path).includes(t.id)) ? 'on' : ''}" data-mtag="${t.id}" title="${t.name}" aria-label="Tag ${t.name}"></button>`).join('')}</div>`;
    const sub = it.children && it.children.length;
    return `<button class="mi${it.danger ? ' danger' : ''}" data-mi="${i}" ${it.disabled ? 'disabled' : ''} role="menuitem"${sub ? ' aria-haspopup="true"' : ''}>${it.html || ic(it.icon || 'check', it.icon ? '' : 'blank')}<span>${esc(it.label)}</span>${it.kbd ? `<kbd>${it.kbd}</kbd>` : ''}${sub ? `<span class="mchev">${ic('fwd')}</span>` : ''}</button>`;
  }).join('');
  el.querySelectorAll('.ic.blank').forEach(s => s.style.visibility = 'hidden');
  document.body.appendChild(el);
  const r = el.getBoundingClientRect();
  let left, top;
  if (anchor){
    left = anchor.right - 3; top = anchor.top - 6;
    if (left + r.width > innerWidth - 6) left = anchor.left - r.width + 3;
  } else { left = x; top = y; }
  el.style.left = Math.max(6, Math.min(left, innerWidth - r.width - 6)) + 'px';
  el.style.top = Math.max(6, Math.min(top, innerHeight - r.height - 6)) + 'px';
  const m = {el, items, x, y, level, hoverT:0};
  menus[level] = m;
  const openSub = (btn, it) => { btn.classList.add('open'); showMenu(0, 0, it.children, level + 1, btn.getBoundingClientRect()); };
  el.addEventListener('mouseover', e => {
    const b = e.target.closest('[data-mi]'); if (!b) return;
    const it = items[+b.dataset.mi];
    clearTimeout(m.hoverT);
    m.hoverT = setTimeout(() => {
      if (!menus.includes(m)) return;
      el.querySelectorAll('.mi.open').forEach(x => { if (x !== b) x.classList.remove('open'); });
      if (it && it.children && it.children.length && !b.disabled){ if (!b.classList.contains('open') || menus.length <= level + 1) openSub(b, it); }
      else closeMenus(level + 1);
    }, 140);
  });
  el.addEventListener('click', e => {
    const t = e.target.closest('[data-mtag]');
    if (t){ const it = items.find(x => x.tags); hideMenu(); toggleTag(it.es, t.dataset.mtag); return; }
    const b = e.target.closest('[data-mi]'); if (!b || b.disabled) return;
    const it = items[+b.dataset.mi];
    if (it.children && it.children.length){ clearTimeout(m.hoverT); openSub(b, it); return; }
    hideMenu(); it.run && it.run();
  });
}

/* ---------- Right-click menus: our items with the Windows items merged into the same groups ---------- */
// Windows verbs we already offer ourselves, or that do nothing outside Explorer.
const SHELL_DUP = new Set(['open', 'opennewwindow', 'opennewprocess', 'opennewtab', 'explore', 'cut', 'copy', 'paste', 'delete', 'rename', 'properties', 'copyaspath', 'pintohome', 'refresh', 'undo', 'redo', 'find', 'opencontaining', 'openinterminal']);
// Labels are in the Windows display language, so match English and Danish.
const RX = {
  dup: /^(open in terminal|åbn i terminal|open in new tab|åbn i ny fane|open in new window|åbn i nyt vindue|copy as path|kopiér som sti|show more options|vis flere indstillinger)$/i,
  openWith: /^(open with|åbn med)/i,
  newMenu: /^(new|ny)$/i,
  edit: /^(create shortcut|opret genvej|compress|komprimer)/i,
  cloud: /onedrive|view online|vis online|free up space|frigør plads|always keep|behold altid|version history|versionshistorik|dropbox|google drive|icloud/i,
  share: /^(share|del|send to|send til|give access|giv adgang|copy link|kopiér link|manage access|administrer adgang)\b/i,
  more: /^(pin|unpin|fastgør|frigør fra|restore previous|gendan tidligere|include in library|medtag i bibliotek|troubleshoot|fejlfind)/i,
  open: /^(open|edit|print|play|preview|cast|rotate|set as|run as|install|mount|extract|åbn|rediger|udskriv|afspil|vis eksempel|roter|angiv som|kør som|installer|tilslut|udpak)/i,
  device: /^(eject|skub ud|format|formatér)/i
};
const ICON_RULES = [[/^(print|udskriv)/i, 'print'], [/^(edit|rediger)/i, 'pencil'], [/^(play|afspil|cast)/i, 'play'], [/^(rotate|roter)/i, 'refresh'], [/^(eject|skub ud)/i, 'up'], [/^(extract|udpak)/i, 'box']];
const iconFor = (label, fallback) => (ICON_RULES.find(([rx]) => rx.test(label)) || [0, fallback])[1];

function shellKids(list){
  const out = [];

    if (s.separator){ if (out.length && out[out.length - 1] !== '-') out.push('-'); continue; }
    if (s.disabled) continue;
    const it = shellItem(s, null);

  while (out[0] === '-') out.shift();
  while (out[out.length - 1] === '-') out.pop();
  return out;
}
function shellItem(s, icon, label){
  if (s.children && s.children.length){
    const kids = shellKids(s.children);
    return kids.length ? {label:label || s.label, icon, children:kids} : null;
  }
  return {label:label || s.label, icon, run:() => invoke('shell_invoke', {id:s.id}).catch(err)};
}
function classify(list){
  const g = {openWith:null, newMenu:null, open:[], edit:[], share:[], cloud:[], device:[], more:[], apps:[]};
  if (!list) return g;
  for (const s of list){
    if (s.separator || s.disabled) continue;
    const L = s.label, kids = s.children && s.children.length;
    if (SHELL_DUP.has(s.verb) || RX.dup.test(L)) continue;
    if (s.verb === 'openas' || RX.openWith.test(L)) g.openWith = s;
    else if (RX.newMenu.test(L) || (kids && s.children.some(c => c.verb === 'newfolder' || c.verb === 'newlink'))) g.newMenu = s;
    else if (s.verb === 'link' || RX.edit.test(L)) g.edit.push(s);
    else if (RX.cloud.test(L)) g.cloud.push(s);
    else if (s.verb === 'windows.modernshare' || s.verb === 'sendto' || RX.share.test(L)) g.share.push(s);
    else if (RX.device.test(L)) g.device.push(s);
    else if (RX.more.test(L) || /^(pinto|unpinfrom|taskbar)/.test(s.verb)) g.more.push(s);
    else if (!kids && RX.open.test(L)) g.open.push(s);
    else g.apps.push(s);
  }
  return g;
}
// Several related Windows items become one submenu; a single one stays inline.
function grouped(label, icon, list){
  if (!list.length) return [];
  if (list.length === 1){ const it = shellItem(list[0], icon); return it ? [it] : []; }
  const kids = list.map(s => shellItem(s, null)).filter(Boolean);

}
function shareAndCloud(g){

}
function appsAndMore(g){
  const apps = g.apps.map(s => shellItem(s, 'box')).filter(Boolean);
  const more = g.more.map(s => shellItem(s, null)).filter(Boolean);
  if (apps.length > 4){ more.unshift(...apps.splice(4)); }

function tidy(items){
  const out = [];
  for (const it of items){ if (it === '-' && (!out.length || out[out.length - 1] === '-')) continue; out.push(it); }
  while (out[out.length - 1] === '-') out.pop();
  return out;
}

function buildItemMenu(es, sh){
  const one = es.length === 1 ? es[0] : null;
  const g = classify(sh);
  const fixed = es.some(e => e.drive || e.place) && T().loc === PC;
  const items = [];
  // Open
  if (one){
    items.push({label:'Open', icon:'open', kbd:'Enter', run:() => openEntry(one)});
    if (!one.dir){
      const ow = g.openWith && shellItem(g.openWith, 'apps', 'Open with');
      items.push(ow || {label:'Open with…', icon:'apps', run:() => openWith(one)});
    }
    g.open.forEach(s => { const it = shellItem(s, iconFor(s.label, 'open')); if (it) items.push(it); });
    if (one.dir) items.push({label:'Open in new tab', icon:'tab', run:() => newTabAt(one.path)}, {label:'Open in Terminal', icon:'terminal', run:() => openTerminal(one.path)});
    if (!one.drive) items.push({label:'Show in File Explorer', icon:'folder', run:() => showInExplorer(one.path)});
    if (!curFolder() && parentOf(one.path) && !one.drive && !one.place) items.push({label:'Open file location', icon:'folder', run:() => go(parentOf(one.path), {select:one.path})});
    g.device.forEach(s => { const it = shellItem(s, iconFor(s.label, 'drive')); if (it) items.push(it); });
  } else g.open.forEach(s => { const it = shellItem(s, iconFor(s.label, 'open')); if (it) items.push(it); });
  items.push('-');
  // Edit
  if (!fixed){
    items.push({label:'Cut', icon:'cut', kbd:MOD + 'X', run:() => setClip('cut')}, {label:'Copy', icon:'copy', kbd:MOD + 'C', run:() => setClip('copy')});
    if (curFolder()) items.push({label:'Duplicate', icon:'copy', kbd:MOD + 'D', run:duplicate});
    if (one) items.push({label:'Rename', icon:'pencil', kbd:'F2', run:() => startRename(one.key)});
  }
  if (one) items.push({label:'Copy path', icon:'link', kbd:'Ctrl+Shift+C', run:() => copyText(one.path, 'Path copied')});
  g.edit.forEach(s => { const it = shellItem(s, 'link'); if (it) items.push(it); });
  items.push('-');
  // Share and sync
  items.push(...shareAndCloud(g), '-');
  // Organize
  items.push({label: es.every(e => S.stars[e.path]) ? 'Unstar' : 'Star', icon:'star', kbd:'S', run:() => toggleStar(es)});
  if (one && one.dir) items.push({label:S.pins.some(p => samePath(p, one.path)) ? 'Remove from Favorites' : 'Add to Favorites', icon:'pin', run:() => pinToggle(one.path)});
  items.push({tags:true, es}, '-');
  // Other apps (7-Zip, Defender, Git, …)
  items.push(...appsAndMore(g), '-');
  if (!fixed) items.push({label:'Delete', icon:'trash', kbd:'Del', danger:true, run:trashSel}, {label:'Delete permanently', icon:'x', kbd:'Shift+Del', danger:true, run:deleteForever}, '-');
  if (one) items.push({label:'Properties', icon:'doc', kbd:'Alt+Enter', run:() => properties(one)});
  return tidy(items);
}

function buildBgMenu(dest, clip, sh){
  const g = classify(sh);
  const items = [];
  if (dest){
    // "New" combines ours with the Windows "New" menu (Word document, shortcut, …), without duplicates.
    const winNew = g.newMenu ? shellKids(g.newMenu.children || []).filter(it => it === '-' || !/^(folder|mappe|text document|tekstdokument)$/i.test(it.label)) : [];
    while (winNew[0] === '-') winNew.shift();
    items.push({label:'New folder', icon:'folderplus', kbd:'Ctrl+Shift+N', run:newFolder},
      {label:'New', icon:'plus', children:tidy([{label:'Folder', icon:'folderplus', run:newFolder}, {label:'Text document', icon:'fileplus', run:newFile}, '-', ...winNew])}, '-',
      {label:clip ? `Paste ${plural(clip.paths.length, 'item')}` : 'Paste', icon:'paste', kbd:MOD + 'V', disabled:!clip, run:paste});
  }
  items.push({label:'Select all', icon:'check', kbd:MOD + 'A', disabled:!ITEMS.length, run:() => selectKeys(ITEMS.map(e => e.key))},
    {label:'Refresh', icon:'refresh', kbd:'F5', run:() => refresh({keep:true})},
    {label:S.hidden ? 'Hide hidden items' : 'Show hidden items', icon:'eye', kbd:'Ctrl+H', run:() => act('hidden')}, '-');
  if (dest){
    items.push({label:'Open in Terminal', icon:'terminal', run:() => openTerminal(dest)}, {label:'Open in File Explorer', icon:'folder', run:() => invoke('open_path', {path:dest}).catch(err)});
    g.open.forEach(s => { const it = shellItem(s, iconFor(s.label, 'open')); if (it) items.push(it); });
    items.push({label:'Copy path', icon:'link', run:() => copyText(dest, 'Path copied')},
      {label:S.pins.some(p => samePath(p, dest)) ? 'Remove from Favorites' : 'Add to Favorites', icon:'pin', run:() => pinToggle(dest)}, '-',
      ...shareAndCloud(g), '-', ...appsAndMore(g), '-',
      {label:'Properties', icon:'doc', run:() => properties({path:dest})});
  }
  return tidy(items);
}

// The Windows part is fetched when the right mouse button goes down, so it is usually ready
// by the time the menu opens. The last result is reused while the same items are right-clicked.
let shellReq = null, shellLast = null, menuSeq = 0;
const shellKey = (paths, bg) => (bg ? 'bg|' : '') + paths.map(lc).join('|');
function fetchShell(paths, bg){
  if (!TAURI || !paths.length) return Promise.resolve(null);
  const key = shellKey(paths, bg);
  if (shellLast && shellLast.key === key && Date.now() - shellLast.t < 20000) return Promise.resolve(shellLast.list);
  if (shellReq && shellReq.key === key) return shellReq.promise;
  const promise = invoke('shell_menu', {paths, background:bg}).then(list => { shellLast = {key, list, t:Date.now()}; return list; }).catch(() => null);
  shellReq = {key, promise};
  return promise;
}
const shellPaths = es => es.filter(e => !e.trashId && (es.length === 1 || samePath(parentOf(e.path) || '', parentOf(es[0].path) || ''))).map(e => e.path);
const pause = ms => new Promise(r => setTimeout(() => r(undefined), ms));
async function openMerged(x, y, build, promise){
  const my = ++menuSeq;
  const first = await Promise.race([promise, pause(500)]);
  if (my !== menuSeq) return;
  showMenu(x, y, build(first || null));
  if (first === undefined){
    const late = await promise;
    if (late && my === menuSeq && menus.length === 1) showMenu(x, y, build(late));
  }
}
function itemMenu(x, y){
  const es = selected(); if (!es.length) return;
  if (es.some(e => e.trashId)){ ++menuSeq; return showMenu(x, y, [{label:'Restore', icon:'restore', run:restoreSel}, '-', {label:'Delete permanently', icon:'x', danger:true, run:deleteForever}]); }
  openMerged(x, y, sh => buildItemMenu(es, sh), fetchShell(shellPaths(es), false));
}
async function bgMenu(x, y){
  const t = T(), dest = curFolder();
  if (t.loc === TRASH){ ++menuSeq; return showMenu(x, y, [{label:'Refresh', icon:'refresh', kbd:'F5', run:() => refresh({keep:true})}, '-', {label:'Empty Recycle Bin', icon:'trash', danger:true, run:emptyTrash}]); }
  const shell = fetchShell(dest ? [dest] : [], true);
  const clip = dest ? await readClip() : null;
  openMerged(x, y, sh => buildBgMenu(dest, clip, sh), shell);
}
// Start building the Windows menu as soon as the right button goes down.
function prefetchFor(e){
  const key = itemFrom(e);
  if (key && BY.has(key)){
    const es = S.sel.has(key) ? selected() : [BY.get(key)];
    if (!es.some(x => x.trashId)) fetchShell(shellPaths(es), false);
  } else if (!key && curFolder()) fetchShell([curFolder()], true);
}
function sortMenu(r){
  const opt = (k, label) => ({label, icon:S.sort.k === k ? 'check' : null, run:() => { if (S.sort.k === k) S.sort.d *= -1; else S.sort = {k, d:k === 'name' || k === 'kind' ? 1 : -1}; persist(); render(); }});
  showMenu(r.left, r.bottom + 4, [{label:'Sort by', header:true}, opt('name', 'Name'), opt('modified', 'Date modified'), opt('size', 'Size'), opt('kind', 'Type'), '-',
    {label:'Ascending', icon:S.sort.d > 0 ? 'check' : null, run:() => { S.sort.d = 1; persist(); render(); }},
    {label:'Descending', icon:S.sort.d < 0 ? 'check' : null, run:() => { S.sort.d = -1; persist(); render(); }}]);
}
async function subfolderMenu(el, p){
  const r = el.getBoundingClientRect();
  if (p === PC){
    return showMenu(r.left, r.bottom + 4, [...S.places.map(pl => ({label:pl.name, icon:PLACE_ICON[pl.id] || 'folder', run:() => go(pl.path)})), '-',
      ...S.drives.map(d => ({label:driveName(d), icon:'drive', run:() => go(d.path)}))]);
  }
  try {
    const list = sortItems((await invoke('list_dir', {path:p})).filter(e => e.dir && visibleEntry(e)));
    showMenu(r.left, r.bottom + 4, list.length ? list.slice(0, 200).map(e => ({label:e.name, icon:'folder', run:() => go(e.path)})) : [{label:'No folders here', disabled:true}]);
  } catch (e){ err(e); }
}

/* ---------- Toast & modal ---------- */
function toast(msg, isErr){
  const box = $('#toast');
  const el = document.createElement('div'); el.className = 'toast' + (isErr ? ' err' : ''); el.setAttribute('role', 'status');
  el.textContent = msg;
  box.innerHTML = ''; box.appendChild(el);
  setTimeout(() => el.remove(), isErr ? 6000 : 3200);
}
function modal({title, body, confirm, danger, run}){
  const m = $('#modal');
  m.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">${esc(title)}</h2><p>${esc(body)}</p><div class="row"><button class="btn" id="mCancel">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="mOk">${esc(confirm)}</button></div></div>`;
  m.hidden = false;
  $('#mCancel').onclick = closeModal;
  $('#mOk').onclick = () => { closeModal(); run(); };
  m.onclick = e => { if (e.target === m) closeModal(); };
  $('#mCancel').focus();
}
function closeModal(){ $('#modal').hidden = true; main.focus({preventScroll:true}); }

        ${row('Show file extensions', 'Show endings like .jpg and .docx in file names.', sw(SET.showExt, 'data-toggle="showExt"'))}

function settingsChanged(){

const pal = $('#palette'); let palSel = 0, palRows = [];
function commands(){

  return [
    {label:'New folder', icon:'folderplus', kbd:'Ctrl+Shift+N', run:newFolder, ok:!!dest},
    {label:'New text document', icon:'fileplus', run:newFile, ok:!!dest},
    {label:'Icon view', icon:'grid', kbd:'Ctrl+1', run:() => act('view', 'grid')},
    {label:'Details view', icon:'list', kbd:'Ctrl+2', run:() => act('view', 'list')},
    {label:'Column view', icon:'columns', kbd:'Ctrl+3', run:() => act('view', 'columns')},
    {label:S.preview ? 'Hide Inspector' : 'Show Inspector', icon:'panel', kbd:'Alt+P', run:() => act('preview')},
    {label:S.hidden ? 'Hide hidden items' : 'Show hidden items', icon:'eye', kbd:'Ctrl+H', run:() => act('hidden')},
    {label:'Settings', icon:'settings', kbd:'Ctrl+,', run:openSettings},
    {label:'New tab', icon:'tab', kbd:'Ctrl+T', run:() => act('newtab')},
    {label:'New window', icon:'open', kbd:'Ctrl+N', run:() => invoke('new_window').catch(err)},
    {label:'Open in File Explorer', icon:'folder', run:() => invoke('open_path', {path:dest}).catch(err), ok:!!dest},

    {label:'Go to Starred', icon:'star', run:() => go(STARRED)},
    {label:'Empty Recycle Bin', icon:'trash', run:emptyTrash}
  ].filter(c => c.ok !== false);
}
function fuzzy(str, q){
  const s = str.toLowerCase();
  if (s.startsWith(q)) return 4; if (s.split(/[\s\-_.\\]/).some(w => w.startsWith(q))) return 3; if (s.includes(q)) return 2;
  let i = 0; for (const ch of s){ if (ch === q[i]) i++; if (i === q.length) return 1; } return 0;
}
function openPalette(){
  hideMenu(); pal.hidden = false;
  pal.innerHTML = `<div class="palette" role="dialog" aria-label="Go to anything"><div class="pal-in">${ic('search')}<input id="palIn" placeholder="Folder, file in this folder, command, or a path like C:\\Users" autocomplete="off" spellcheck="false" aria-label="Go to"></div><div class="pal-list" id="palList"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> Move</span><span><kbd>Enter</kbd> Open</span><span><kbd>Esc</kbd> Close</span></div></div>`;
  palSel = 0; renderPalette();
  const i = $('#palIn'); i.focus(); i.addEventListener('input', () => { palSel = 0; renderPalette(); });
  pal.onclick = e => { if (e.target === pal) closePalette(); };
}
function closePalette(){ pal.hidden = true; main.focus({preventScroll:true}); }
function renderPalette(){
  const raw = $('#palIn') ? $('#palIn').value.trim() : '';
  const q = raw.toLowerCase();
  const rows = [];
  if (/^[A-Za-z]:|^\\\\|^\//.test(raw)) rows.push({group:'Path', label:`Go to ${normalizeTyped(raw)}`, icon:'open', run:() => goTyped(raw)});
  const places = [...S.places.map(p => ({label:p.name, path:p.path, icon:PLACE_ICON[p.id] || 'folder'})), ...S.drives.map(d => ({label:driveName(d), path:d.path, icon:'drive'})),
    ...S.pins.map(p => ({label:baseName(p), path:p, icon:'folder'})), ...S.recent.map(p => ({label:baseName(p) || p, path:p, icon:'clock'}))];
  const seen = new Set();
  const placeRows = places.filter(p => { const k = lc(p.path); if (seen.has(k)) return false; seen.add(k); return true; })
    .map(p => ({...p, s:q ? Math.max(fuzzy(p.label, q), fuzzy(p.path, q) ? 1 : 0) : 1})).filter(p => p.s).sort((a, b) => b.s - a.s).slice(0, q ? 7 : 6);
  placeRows.forEach(p => rows.push({group:'Places and recent folders', label:p.label, sub:p.path, icon:p.icon, run:() => go(p.path)}));
  if (q) ITEMS.filter(e => !e.trashId).map(e => ({e, s:fuzzy(e.name, q)})).filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 8)
    .forEach(({e}) => rows.push({group:'In this location', label:e.name, sub:parentOf(e.path) || '', glyph:glyph(e), run:() => { selectKeys([e.key]); if (e.dir) go(e.path); }}));
  commands().map(c => ({...c, s:q ? fuzzy(c.label, q) : 1})).filter(c => c.s).sort((a, b) => b.s - a.s).slice(0, q ? 5 : 8)
    .forEach(c => rows.push({group:'Commands', label:c.label, icon:c.icon, kbd:c.kbd, run:c.run}));
  palRows = rows;
  if (palSel >= rows.length) palSel = Math.max(0, rows.length - 1);
  let html = '', g = '';
  rows.forEach((r, i) => {
    if (r.group !== g){ g = r.group; html += `<div class="mlabel">${esc(g)}</div>`; }
    html += `<button class="pi${i === palSel ? ' hl' : ''}" data-pi="${i}"><span class="sg">${r.glyph || ic(r.icon)}</span><span class="t">${q ? hl(r.label, q) : esc(r.label)}</span>${r.sub ? `<span class="p">${esc(r.sub)}</span>` : ''}${r.kbd ? `<kbd>${r.kbd}</kbd>` : ''}</button>`;
  });
  if (!rows.length) html = `<div class="col-empty" style="padding:18px">Nothing matches “${esc(raw)}”. Type a full path like C:\\Users to jump there.</div>`;
  const list = $('#palList'); list.innerHTML = html;
  list.querySelectorAll('[data-pi]').forEach(b => b.onclick = () => runPal(+b.dataset.pi));
  const h = list.querySelector('.hl'); if (h) h.scrollIntoView({block:'nearest'});
}
function runPal(i){ const r = palRows[i]; if (!r) return; closePalette(); r.run(); }
async function goTyped(v){
  const p = normalizeTyped(v); if (!p) return;
  try {
    const [st] = await invoke('stat_many', {paths:[p]});
    if (!st) return toast(`Files can’t find “${p}”. Check the spelling and try again.`, true);
    if (st.dir) go(st.path); else { go(parentOf(st.path), {select:st.path}); }
  } catch (e){ err(e); }
}

/* ---------- Dispatcher ---------- */
function act(name, arg, el){
  switch (name){
    case 'view': S.view = arg; persist(); render(); break;
    case 'preview': S.preview = !S.preview; persist(); render(); break;
    case 'hidden': S.hidden = !S.hidden; S.tree.clear(); persist(); render(); toast(S.hidden ? 'Showing hidden items' : 'Hidden items are hidden'); break;
    case 'sort': if (S.sort.k === arg) S.sort.d *= -1; else S.sort = {k:arg, d:arg === 'name' || arg === 'kind' ? 1 : -1}; persist(); render(); break;
    case 'sort-menu': sortMenu(el.getBoundingClientRect()); break;
    case 'new-menu': { const r = el.getBoundingClientRect(); showMenu(r.right - 230, r.bottom + 4, [{label:'Folder', icon:'folderplus', kbd:'Ctrl+Shift+N', run:newFolder}, {label:'Text document', icon:'fileplus', run:newFile}]); break; }
    case 'new-folder': newFolder(); break;
    case 'new-file': newFile(); break;
    case 'tab': if (S.tab !== +arg){ S.tab = +arg; persist(); main.scrollTop = 0; refresh(); } break;
    case 'closetab': { const i = +arg; if (S.tabs.length < 2) break; S.tabs.splice(i, 1); const was = S.tab; if (S.tab > i || S.tab >= S.tabs.length) S.tab--; S.tab = Math.max(0, S.tab); persist(); if (was === i || S.tab !== was) refresh(); else render(); break; }
    case 'newtab': {
      const home = (S.places.find(p => p.id === 'home') || {}).path;
      newTabAt(SET.newTab === 'pc' ? PC : SET.newTab === 'home' && home ? home : isPath(T().loc) ? T().loc : PC);
      break;
    }
    case 'fold': { const c = SET.collapsed; SET.collapsed = c.includes(arg) ? c.filter(x => x !== arg) : [...c, arg]; persist(); renderSide(); break; }
    case 'clear-search': T().q = ''; $('#search').value = ''; refresh(); break;
    case 'refresh': refresh({keep:true}); break;
    case 'up': goUp(); break;
    case 'more': S.limit = Infinity; render(); break;
    case 'star-sel': toggleStar(selected()); break;
    case 'tag': toggleTag(selected(), arg); break;
    case 'rename': startRename(); break;
    case 'open-sel': openEntry(selected()[0]); break;
    case 'trash-sel': trashSel(); break;
    case 'delete-sel': deleteForever(); break;
    case 'restore-sel': restoreSel(); break;
    case 'copy': setClip('copy'); break;
    case 'empty-trash': emptyTrash(); break;
    case 'calc-size': calcSize(arg); break;
    case 'terminal': openTerminal(arg); break;
  }
}

/* ---------- Window controls ---------- */
const MAX_SVG = '<svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
const RESTORE_SVG = '<svg viewBox="0 0 10 10"><rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.5 2.5V0.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
async function syncMax(){
  let m = false; try { m = appWin ? await appWin.isMaximized() : false; } catch {}
  const b = $('#wMax'); b.innerHTML = m ? RESTORE_SVG : MAX_SVG; b.title = m ? 'Restore down' : 'Maximize'; b.setAttribute('aria-label', b.title);
}
$('#wMin').onclick = () => appWin && appWin.minimize();
$('#wMax').onclick = () => appWin && appWin.toggleMaximize();
$('#wClose').onclick = () => appWin && appWin.close();
if (appWin) appWin.onResized(() => syncMax());
syncMax();

/* ---------- Events ---------- */
$('#brandMark').innerHTML = ic('drawer'); $('#bSettings').innerHTML = ic('settings'); $('#bSettings').onclick = openSettings;
$('#bMenu').innerHTML = ic('menu'); $('#bBack').innerHTML = ic('back'); $('#bFwd').innerHTML = ic('fwd'); $('#bUp').innerHTML = ic('up');
$('#bRefresh').innerHTML = ic('refresh'); $('#sIcon').innerHTML = ic('search'); $('#bPreview').innerHTML = ic('panel');
$('#bBack').onclick = () => histStep(-1); $('#bFwd').onclick = () => histStep(1); $('#bUp').onclick = goUp;
$('#bRefresh').onclick = () => { S.cache.clear(); refresh({keep:true}); };
$('#bPreview').onclick = () => act('preview');
$('#bMenu').onclick = () => app.classList.add('side-open');
$('#sideScrim').onclick = () => app.classList.remove('side-open');

document.addEventListener('mousedown', e => { if (menuOpen() && !inMenu(e.target)) hideMenu(); }, true);
document.addEventListener('click', e => {
  if (suppressClick) return;
  const tw = e.target.closest('[data-tree]');
  if (tw){ e.stopPropagation(); toggleTree(tw.dataset.tree); return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled){ e.stopPropagation(); act(a.dataset.act, a.dataset.arg, a); return; }
  const sub = e.target.closest('[data-sub]');
  if (sub){ e.stopPropagation(); subfolderMenu(sub, sub.dataset.sub); return; }
  const l = e.target.closest('[data-loc]');
  if (l && !e.target.closest('.item') && l.dataset.loc){ e.stopPropagation(); go(l.dataset.loc); }
}, true);
document.addEventListener('auxclick', e => {
  if (e.button !== 1) return;
  const t = e.target.closest('.tab'); if (t){ e.preventDefault(); act('closetab', t.dataset.arg); return; }
  const l = e.target.closest('[data-loc]'); if (l && isPath(l.dataset.loc)){ e.preventDefault(); newTabAt(l.dataset.loc); return; }
  const it = e.target.closest('.item'); if (it){ const en = BY.get(it.dataset.key); if (en && en.dir){ e.preventDefault(); newTabAt(en.path); } }
});
document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, .textpv, .dl dd')) e.preventDefault(); });
$('#side').addEventListener('contextmenu', e => {
  const s = e.target.closest('.sitem'); if (!s) return;
  const loc = s.dataset.loc; if (!isPath(loc)) return;
  const pinned = S.pins.some(p => samePath(p, loc)), place = S.places.some(p => samePath(p.path, loc));
  showMenu(e.clientX, e.clientY, [{label:'Open', icon:'open', run:() => go(loc)}, {label:'Open in new tab', icon:'tab', run:() => newTabAt(loc)}, {label:'Open in Terminal', icon:'terminal', run:() => openTerminal(loc)}, {label:'Copy path', icon:'link', run:() => copyText(loc, 'Path copied')},
    ...(place || isRoot(loc) ? [] : ['-', {label:pinned ? 'Remove from Favorites' : 'Add to Favorites', icon:'pin', run:() => pinToggle(loc)}])]);
});

// Search
const sIn = $('#search'); let sT = 0;
sIn.addEventListener('input', () => {
  clearTimeout(sT);
  sT = setTimeout(() => { const t = T(); t.q = sIn.value; main.scrollTop = 0; refresh(); }, isPath(T().loc) ? 350 : 80);
});
sIn.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ clearTimeout(sT); sIn.value = ''; T().q = ''; refresh(); main.focus(); }
  if (e.key === 'Enter'){ clearTimeout(sT); const t = T(); if (t.q !== sIn.value){ t.q = sIn.value; refresh(); } else if (ITEMS.length){ selectKeys([ITEMS[0].key]); main.focus(); } }
  if (e.key === 'ArrowDown' && ITEMS.length){ e.preventDefault(); selectKeys([ITEMS[0].key]); main.focus(); }
});

// Address bar: click empty space or Ctrl+L to type a path
function editPath(){
  editingPath = true;
  const t = T(); const val = isPath(t.loc) ? t.loc : '';
  $('#crumbs').innerHTML = `<input id="pathIn" value="${esc(val)}" spellcheck="false" placeholder="Type a path, like C:\\Users" aria-label="Path">`;
  const i = $('#pathIn'); i.focus(); i.select();
  let done = false;
  const finish = ok => {
    if (done) return; done = true; editingPath = false;
    if (ok && i.value.trim() && !(isPath(t.loc) && samePath(normalizeTyped(i.value), t.loc))) goTyped(i.value);
    renderToolbar();
  };
  i.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape'){ finish(false); main.focus(); } });
  i.addEventListener('blur', () => finish(false));
}
$('#crumbs').addEventListener('click', e => { if (!editingPath && !e.target.closest('.crumb, .csep')) editPath(); });

// Items
let suppressClick = false;
const suppress = () => { suppressClick = true; setTimeout(() => suppressClick = false, 0); };
function itemFrom(e){ const el = e.target.closest('.item'); return el && main.contains(el) ? el.dataset.key : null; }
// Double-clicks are detected here rather than with the dblclick event: the first click updates the
// selection, and the browser drops dblclick when the element under the mouse changed between clicks.
let lastClick = {key:null, t:0};
main.addEventListener('click', e => {
  if (suppressClick || e.target.closest('[data-act]')) return;
  const key = itemFrom(e);
  if (!key){ if (!e.target.closest('.lhead, .more')){ S.sel.clear(); S.focus = null; renderSel(); } return; }
  if (S.renaming === key) return;
  const el = e.target.closest('.item');
  const add = e.ctrlKey || e.metaKey;
  const now = performance.now();
  const dbl = lastClick.key === key && now - lastClick.t < 500;
  lastClick = dbl ? {key:null, t:0} : {key, t:now};
  if (!add && !e.shiftKey && (dbl || SET.singleClick)){
    const en = BY.get(key) || [...S.cache.values()].flat().find(x => x.key === key);
    if (en){ S.sel = new Set([key]); S.focus = S.anchor = key; openEntry(en); return; }
  }
  // Column view: items from parent columns navigate.
  if (el.classList.contains('citem') && !BY.has(key)){
    const p = key; const en = [...S.cache.values()].flat().find(x => x.key === p);
    if (en && en.dir) return go(en.path);
    if (en) return go(parentOf(en.path), {select:en.path});
    return;
  }
  if (el.classList.contains('citem') && BY.get(key).dir && !add && !e.shiftKey) return go(BY.get(key).path);
  if (e.shiftKey && S.anchor && BY.has(S.anchor)){
    const a = ITEMS.findIndex(x => x.key === S.anchor), b = ITEMS.findIndex(x => x.key === key);
    if (!add) S.sel.clear();
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) S.sel.add(ITEMS[i].key);
  } else if (add){ S.sel.has(key) ? S.sel.delete(key) : S.sel.add(key); S.anchor = key; }
  else { S.sel = new Set([key]); S.anchor = key; }
  S.focus = key; renderSel();
});
main.addEventListener('contextmenu', e => {
  e.preventDefault();
  const key = itemFrom(e);
  if (key && BY.has(key)){ if (!S.sel.has(key)){ S.sel = new Set([key]); S.anchor = key; } S.focus = key; renderSel(); itemMenu(e.clientX, e.clientY); }
  else if (!key) bgMenu(e.clientX, e.clientY);
});

// Pointer drag: marquee on empty space, move/copy when dragging items
let mq = null, pd = null, ghost = null, dropEl = null;
main.addEventListener('mousedown', e => { if (e.button === 2) prefetchFor(e); });
main.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('.lhead, button, input, .more')) return;
  const key = itemFrom(e);
  if (key){ if (S.renaming !== key && BY.has(key)) pd = {x:e.clientX, y:e.clientY, key, started:false}; return; }
  if (main.classList.contains('mode-columns')) return;
  mq = {x:e.clientX, y:e.clientY, base:(e.ctrlKey || e.shiftKey) ? new Set(S.sel) : new Set(), el:null};
});
function dropTargetAt(x, y){
  const el = document.elementFromPoint(x, y);
  const d = el && el.closest('[data-drop]');
  if (d) return {el:d, target:d.dataset.drop};
  if (el && main.contains(el) && curFolder()) return {el:main, target:curFolder()};
  return null;
}
function canDrop(target, paths){
  if (!target) return false;
  if (target === TRASH || target === STARRED || target.startsWith('::tag:')) return T().loc !== TRASH;
  if (!isPath(target)) return false;
  return paths.every(p => !samePath(p, target) && !isInside(target, p)) && !paths.every(p => samePath(parentOf(p) || '', target));
}
function dropVerb(target, paths, ev){
  if (target === TRASH) return 'Delete';
  if (target === STARRED) return 'Star';
  if (target.startsWith('::tag:')) return 'Tag';
  if (ev.ctrlKey) return 'Copy to';
  if (ev.shiftKey) return 'Move to';
  return WIN && paths.some(p => driveOf(p) !== driveOf(target)) ? 'Copy to' : 'Move to';
}
document.addEventListener('mousemove', e => {
  if (pd){
    if (!pd.started){
      if (Math.abs(e.clientX - pd.x) + Math.abs(e.clientY - pd.y) < 6) return;
      if (!S.sel.has(pd.key)){ S.sel = new Set([pd.key]); S.anchor = S.focus = pd.key; render(); }
      pd.items = selected().filter(x => !x.trashId && !(x.drive || x.place && T().loc === PC));
      if (!pd.items.length){ pd = null; return; }
      pd.paths = pd.items.map(x => x.path); pd.started = true;
      ghost = document.createElement('div'); ghost.className = 'dragghost'; document.body.appendChild(ghost);
    }
    // Leaving the window hands the drag to Windows, so files can be dropped in Explorer, the desktop or other apps.
    if (e.clientX <= 1 || e.clientY <= 1 || e.clientX >= innerWidth - 2 || e.clientY >= innerHeight - 2){
      const paths = pd.paths; pd = null;
      if (ghost){ ghost.remove(); ghost = null; }
      if (dropEl){ dropEl.classList.remove('drop-hot'); dropEl = null; }
      suppress();
      invoke('start_drag', {paths}).catch(err);
      return;
    }
    const t = dropTargetAt(e.clientX, e.clientY);
    if (dropEl) dropEl.classList.remove('drop-hot');
    dropEl = null; pd.target = null;
    if (t && canDrop(t.target, pd.paths)){ dropEl = t.el; dropEl.classList.add('drop-hot'); pd.target = t.target; }
    const label = pd.items.length === 1 ? pd.items[0].name : `${pd.items.length} items`;
    ghost.innerHTML = pd.target ? `<span class="act">${dropVerb(pd.target, pd.paths, e)} ${esc(locName(pd.target))}</span><span>${esc(label)}</span>` : `<span>${esc(label)}</span>`;
    ghost.style.left = (e.clientX + 14) + 'px'; ghost.style.top = (e.clientY + 12) + 'px';
    return;
  }
  if (!mq) return;
  const dx = e.clientX - mq.x, dy = e.clientY - mq.y;
  if (!mq.el){ if (Math.abs(dx) + Math.abs(dy) < 5) return; mq.el = document.createElement('div'); mq.el.className = 'marquee'; document.body.appendChild(mq.el); }
  const mr = main.getBoundingClientRect();
  const x1 = Math.max(mr.left, Math.min(mq.x, e.clientX)), y1 = Math.max(mr.top, Math.min(mq.y, e.clientY));
  const x2 = Math.min(mr.right, Math.max(mq.x, e.clientX)), y2 = Math.min(mr.bottom, Math.max(mq.y, e.clientY));
  Object.assign(mq.el.style, {left:x1 + 'px', top:y1 + 'px', width:(x2 - x1) + 'px', height:(y2 - y1) + 'px'});
  const sel = new Set(mq.base);
  main.querySelectorAll('.item').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1) sel.add(el.dataset.key);
    el.classList.toggle('sel', sel.has(el.dataset.key));
  });
  mq.sel = sel;
});
document.addEventListener('mouseup', e => {
  if (pd){
    const d = pd; pd = null;
    if (d.started){
      suppress();
      if (ghost){ ghost.remove(); ghost = null; }
      if (dropEl){ dropEl.classList.remove('drop-hot'); dropEl = null; }
      const t = d.target;
      if (t === TRASH) trashSel();
      else if (t === STARRED){ if (!d.items.every(x => S.stars[x.path])) toggleStar(d.items); }
      else if (t && t.startsWith('::tag:')){ const tg = t.slice(6); if (!d.items.every(x => tagsOf(x.path).includes(tg))) toggleTag(d.items, tg); toast(`Tagged ${plural(d.items.length, 'item')} ${locName(t)}`); }
      else if (t) transfer(d.paths, t, dropVerb(t, d.paths, e) === 'Copy to');
    }
    return;
  }
  if (!mq) return;
  if (mq.el){ mq.el.remove(); S.sel = mq.sel || new Set(); S.focus = null; suppress(); render(); }
  mq = null;
});

// Files dropped from other apps (Explorer, desktop)
if (TAURI && TAURI.webview){
  let extEl = null;
  const clearExt = () => { if (extEl){ extEl.classList.remove('drop-hot'); extEl = null; } };
  TAURI.webview.getCurrentWebview().onDragDropEvent(ev => {
    const p = ev.payload;
    if (p.type === 'leave'){ clearExt(); return; }
    const x = p.position.x / devicePixelRatio, y = p.position.y / devicePixelRatio;
    const t = dropTargetAt(x, y);
    const ok = t && isPath(t.target);
    if (p.type === 'enter' || p.type === 'over'){ clearExt(); if (ok){ extEl = t.el; extEl.classList.add('drop-hot'); } return; }
    if (p.type === 'drop'){
      clearExt();
      if (!ok) return toast('Drop files on a folder, or into an open folder.', true);
      const paths = (p.paths || []).filter(Boolean); if (!paths.length) return;
      const copy = !WIN || paths.some(q => driveOf(q) !== driveOf(t.target));
      transfer(paths, t.target, copy);
    }
  });
}

// Keyboard
function gridCols(){
  if (S.view !== 'grid' || main.classList.contains('mode-columns')) return 1;
  const g = main.querySelector('.grid'); if (!g || T().loc === PC) return 1;
  return getComputedStyle(g).gridTemplateColumns.split(' ').length;
}
function moveFocus(delta, extend){
  if (!ITEMS.length) return;
  let i = ITEMS.findIndex(x => x.key === (S.focus || [...S.sel].pop()));
  i = i < 0 ? (delta > 0 ? 0 : ITEMS.length - 1) : Math.max(0, Math.min(ITEMS.length - 1, i + delta));
  const key = ITEMS[i].key;
  if (extend && S.anchor && BY.has(S.anchor)){
    const a = ITEMS.findIndex(x => x.key === S.anchor); S.sel.clear();
    for (let k = Math.min(a, i); k <= Math.max(a, i); k++) S.sel.add(ITEMS[k].key);
    S.focus = key; renderSel();
  } else selectKeys([key]);
}
document.addEventListener('keydown', e => {
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  if (!pal.hidden){
    if (k === 'Escape'){ e.preventDefault(); closePalette(); }
    else if (k === 'ArrowDown'){ e.preventDefault(); palSel = Math.min(palRows.length - 1, palSel + 1); renderPalette(); }
    else if (k === 'ArrowUp'){ e.preventDefault(); palSel = Math.max(0, palSel - 1); renderPalette(); }
    else if (k === 'Enter'){ e.preventDefault(); runPal(palSel); }
    return;
  }
  if (!$('#modal').hidden){ if (k === 'Escape') closeModal(); return; }
  if (ctrl && k.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); return; }
  if (ctrl && k === ','){ e.preventDefault(); openSettings(); return; }
  if ((ctrl && k.toLowerCase() === 'l') || (e.altKey && k.toLowerCase() === 'd')){ e.preventDefault(); editPath(); return; }
  if (ctrl && k.toLowerCase() === 'f'){ e.preventDefault(); sIn.focus(); sIn.select(); return; }
  if (ctrl && k.toLowerCase() === 't'){ e.preventDefault(); act('newtab'); return; }
  if (ctrl && k.toLowerCase() === 'w'){ e.preventDefault(); if (S.tabs.length > 1) act('closetab', S.tab); else appWin && appWin.close(); return; }
  if (ctrl && k === 'Tab'){ e.preventDefault(); act('tab', (S.tab + (e.shiftKey ? S.tabs.length - 1 : 1)) % S.tabs.length); return; }
  if (k === 'F5'){ e.preventDefault(); S.cache.clear(); refresh({keep:true}); return; }
  if (menuOpen() && k === 'Escape'){ hideMenu(); return; }
  if (e.target.matches('input, textarea')) return;
  const sel = selected(), inTrash = T().loc === TRASH;
  if (ctrl && k === '1'){ e.preventDefault(); return act('view', 'grid'); }
  if (ctrl && k === '2'){ e.preventDefault(); return act('view', 'list'); }
  if (ctrl && k === '3'){ e.preventDefault(); return act('view', 'columns'); }
  if (ctrl && e.shiftKey && k.toLowerCase() === 'n'){ e.preventDefault(); return newFolder(); }
  if (ctrl && e.shiftKey && k.toLowerCase() === 'c'){ e.preventDefault(); if (sel.length === 1) copyText(sel[0].path, 'Path copied'); else if (curFolder()) copyText(curFolder(), 'Path copied'); return; }
  if (ctrl && k.toLowerCase() === 'a'){ e.preventDefault(); return selectKeys(ITEMS.map(x => x.key)); }
  if (ctrl && k.toLowerCase() === 'c'){ e.preventDefault(); return setClip('copy'); }
  if (ctrl && k.toLowerCase() === 'x'){ e.preventDefault(); return setClip('cut'); }
  if (ctrl && k.toLowerCase() === 'v'){ e.preventDefault(); return paste(); }
  if (ctrl && k.toLowerCase() === 'd'){ e.preventDefault(); return duplicate(); }
  if (ctrl && k.toLowerCase() === 'h'){ e.preventDefault(); return act('hidden'); }
  if (e.altKey && k === 'ArrowLeft'){ e.preventDefault(); return histStep(-1); }
  if (e.altKey && k === 'ArrowRight'){ e.preventDefault(); return histStep(1); }
  if (e.altKey && k === 'ArrowUp'){ e.preventDefault(); return goUp(); }
  if (e.altKey && k.toLowerCase() === 'p'){ e.preventDefault(); return act('preview'); }
  if (e.altKey && k === 'Enter'){ e.preventDefault(); if (sel.length === 1) properties(sel[0]); else if (curFolder()) properties({path:curFolder()}); return; }
  if (ctrl && !e.shiftKey && k.toLowerCase() === 'n'){ e.preventDefault(); invoke('new_window').catch(err); return; }
  if (ctrl || e.altKey) return;
  if (k === 'BrowserBack'){ return histStep(-1); }
  const cols = gridCols();
  switch (k){
    case 'ArrowRight': e.preventDefault(); if (cols > 1) moveFocus(1, e.shiftKey); else if (S.view === 'columns' && sel.length === 1 && sel[0].dir) go(sel[0].path); return;
    case 'ArrowLeft': e.preventDefault(); if (cols > 1) moveFocus(-1, e.shiftKey); else if (S.view === 'columns') goUp(); return;
    case 'ArrowDown': e.preventDefault(); moveFocus(cols, e.shiftKey); return;
    case 'ArrowUp': e.preventDefault(); moveFocus(-cols, e.shiftKey); return;
    case 'Home': e.preventDefault(); if (ITEMS.length) selectKeys([ITEMS[0].key]); return;
    case 'End': e.preventDefault(); if (ITEMS.length) selectKeys([ITEMS[ITEMS.length - 1].key]); return;
    case 'Enter': e.preventDefault(); if (sel.length === 1) openEntry(sel[0]); else if (sel.length) sel.filter(x => !x.dir).forEach(openEntry); return;
    case 'Backspace': e.preventDefault(); histStep(-1); return;
    case 'Delete': e.preventDefault(); if (!sel.length) return; if (e.shiftKey || inTrash) deleteForever(); else trashSel(); return;
    case 'F2': e.preventDefault(); if (sel.length === 1) startRename(sel[0].key); return;
    case 'Escape': if (T().q) act('clear-search'); else if (S.clip){ S.clip = null; render(); } else { S.sel.clear(); S.focus = null; render(); } return;
  }
  if (sel.length && !inTrash){
    if (k === 's' || k === 'S'){ e.preventDefault(); return toggleStar(sel); }
    if (/^[1-6]$/.test(k)){ e.preventDefault(); return toggleTag(sel, TAGS[+k - 1].id); }
  }
  if (k.length === 1 && /\S/.test(k) && !(sel.length && /^[1-6sS]$/.test(k))){
    clearTimeout(S.typeT); S.typeBuf += k.toLowerCase(); S.typeT = setTimeout(() => S.typeBuf = '', 800);
    const hit = ITEMS.find(x => x.name.toLowerCase().startsWith(S.typeBuf));
    if (hit) selectKeys([hit.key]);
  }
});
document.addEventListener('mouseup', e => { if (e.button === 3){ e.preventDefault(); histStep(-1); } if (e.button === 4){ e.preventDefault(); histStep(1); } });

// Live updates: Rust watches the open folder and tells us when something in it changes.
if (TAURI && TAURI.event){
  let fsT = 0;
  TAURI.event.listen('fs-changed', ev => {
    clearTimeout(fsT);
    fsT = setTimeout(() => {
      const t = T();
      if (!isPath(t.loc) || t.q || !samePath(t.loc, ev.payload) || S.renaming || pd || mq || S.busy) return;
      S.cache.delete(lc(t.loc));
      refresh({keep:true, quiet:true});
    }, 300);
  });
}

// Pick up changes made in other apps when Files gets focus again
let lastFocus = 0;
window.addEventListener('focus', () => {
  if (Date.now() - lastFocus < 1500 || S.renaming || pd || mq) return;
  lastFocus = Date.now(); S.cache.clear(); refresh({keep:true, quiet:true});
});

/* ---------- Boot ---------- */
(async function boot(){
  restore();
  applySettings();
  if (SET.start !== 'last'){ S.tabs = []; }
  if (!S.tabs.length){ S.tabs = [newTab(PC)]; S.tab = 0; }
  if (innerWidth <= 1080) S.preview = false;
  render();
  if (!TAURI){ S.error = 'Files has to run as the desktop app to read your files. Start it with cargo run.'; render(); return; }
  await Promise.all([loadPlaces(), loadDrives()]);
  if (SET.start === 'home'){ const h = S.places.find(p => p.id === 'home'); if (h) S.tabs = [newTab(h.path)]; }
  await refresh();
  main.focus({preventScroll:true});
})();
})();
</script>
